  <text x="630" y="157" font-size="15" fill="#2471a3">1.42&#215;</text>
  <text x="238" y="207" font-size="14" fill="#363636" text-anchor="end">Russian · GPT-4 tokenizer</text>
  <rect x="250" y="184" width="528" height="34" fill="#AF1F25" fill-opacity="0.9"/>
  <text x="790" y="207" font-size="15" font-weight="700" fill="#AF1F25">33 tokens</text>
