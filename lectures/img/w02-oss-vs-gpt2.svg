<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif">
  <text x="30" y="34" font-size="13" fill="#7a7f85">the same skeleton, newer parts — gpt-oss numbers from its model card (OpenAI, August 2025)</text>
  <text x="30" y="62" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1"></text>
  <text x="270" y="62" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1">GPT-2 small (2019)</text>
  <text x="570" y="62" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1">gpt-oss-120b (2025)</text>
  <line x1="30" y1="72" x2="970" y2="72" stroke="#AF1F25" stroke-width="1.5"/>
  <text x="30" y="100" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >blocks</text>
  <text x="270" y="100" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >12</text>
  <text x="570" y="100" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >36</text>
  <line x1="30" y1="112" x2="970" y2="112" stroke="#e6e2d8"/>
  <text x="30" y="130" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >numbers per token vector</text>
  <text x="270" y="130" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >768</text>
  <text x="570" y="130" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >2,880</text>
  <line x1="30" y1="142" x2="970" y2="142" stroke="#e6e2d8"/>
  <text x="30" y="160" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >vocabulary</text>
  <text x="270" y="160" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >50,257</text>
  <text x="570" y="160" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >201,088 (o200k_harmony)</text>
  <line x1="30" y1="172" x2="970" y2="172" stroke="#e6e2d8"/>
  <text x="30" y="190" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >where am I?</text>
  <text x="270" y="190" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >a learned row per position, max 1,024</text>
  <text x="570" y="190" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >RoPE: rotate q and k by position → 131,072</text>
  <line x1="30" y1="202" x2="970" y2="202" stroke="#e6e2d8"/>
  <text x="30" y="220" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >rescaling</text>
  <text x="270" y="220" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >LayerNorm</text>
  <text x="570" y="220" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >RMSNorm (the same idea, cheaper)</text>
  <line x1="30" y1="232" x2="970" y2="232" stroke="#e6e2d8"/>
  <text x="30" y="250" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >attention heads</text>
  <text x="270" y="250" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >12, each with its own keys and values</text>
  <text x="570" y="250" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >64 questions sharing 8 key/value sets (GQA)</text>
  <line x1="30" y1="262" x2="970" y2="262" stroke="#e6e2d8"/>
  <text x="30" y="280" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >which tokens it reads</text>
  <text x="270" y="280" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >all earlier ones</text>
  <text x="570" y="280" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >all earlier, or only the last 128 — alternating</text>
  <line x1="30" y1="292" x2="970" y2="292" stroke="#e6e2d8"/>
  <text x="30" y="310" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >MLP</text>
  <text x="270" y="310" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >one: 768 → 3,072 → 768, GELU</text>
  <text x="570" y="310" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >128 experts, 4 picked per token, SwiGLU</text>
  <line x1="30" y1="322" x2="970" y2="322" stroke="#e6e2d8"/>
  <text x="30" y="340" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >share of numbers in the MLP</text>
  <text x="270" y="340" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >46%</text>
  <text x="570" y="340" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >98%</text>
  <line x1="30" y1="352" x2="970" y2="352" stroke="#e6e2d8"/>
  <text x="30" y="370" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >total numbers</text>
  <text x="270" y="370" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >124 million</text>
  <text x="570" y="370" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >116.83 billion, 5.13B used per token</text>
  <line x1="30" y1="382" x2="970" y2="382" stroke="#e6e2d8"/>
  <text x="30" y="414" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >Every new part saves memory or reaches further back. None changes the loop or the block.</text>
</svg>