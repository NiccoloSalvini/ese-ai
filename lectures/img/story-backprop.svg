  <text x="30" y="412" font-size="14" font-weight="400" fill="#363636" text-anchor="start" >Backward, right to left: each box’s blame = the blame of the box after it × how much it moved that box.</text>
  <text x="30" y="434" font-size="14" font-weight="700" fill="#363636" text-anchor="start" >Each weight’s blame is (p − y) × its input: (0.62 − 1) × 1 = -0.38 — and w₃ gets none, because x₃ was 0.</text>
