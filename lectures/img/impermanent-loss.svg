  <line x1="648" y1="86" x2="648" y2="330" stroke="#e6e2d8"/>
  <text x="674" y="124" font-size="15" fill="#363636">It is symmetric in log price:</text>
  <text x="674" y="146" font-size="15" font-weight="700" fill="#AF1F25">halving hurts as much as doubling.</text>
  <text x="674" y="190" font-size="15" fill="#363636">The benchmark is <tspan font-weight="700">holding</tspan></text>
  <text x="674" y="210" font-size="15" fill="#363636"><tspan font-weight="700">the two assets</tspan> &#8212; never your deposit.</text>
  <text x="674" y="248" font-size="13" fill="#7a7f85">An LP can be up in euros and still</text>
  <text x="674" y="265" font-size="13" fill="#7a7f85">have lost to doing nothing.</text>
  <text x="674" y="300" font-size="13" fill="#363636">Fee income is the payment for</text>
  <text x="674" y="317" font-size="13" fill="#363636">bearing this. Compare the two.</text>
