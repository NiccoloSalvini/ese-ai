<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="30" y="34" font-size="13" fill="#7a7f85">fit on a past window, test on the next one, roll forward &#8212; and never look back</text>
  <text x="30" y="96" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">ONE SPLIT</text>
  <rect x="150" y="104" width="454" height="30" fill="#2471a3" fill-opacity="0.85"/>
  <text x="377" y="124" font-size="13" fill="#ffffff" text-anchor="middle">fit</text>
  <rect x="604" y="104" width="182" height="30" fill="#a8955a" fill-opacity="0.9"/>
  <text x="695" y="124" font-size="13" fill="#ffffff" text-anchor="middle">test</text>
  <text x="800" y="117" font-size="13" fill="#AF1F25">one number, from</text>
  <text x="800" y="134" font-size="13" fill="#AF1F25">one period</text>
  <text x="30" y="188" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">WALK-FORWARD</text>
  <rect x="150" y="196" width="273" height="28" fill="#2471a3" fill-opacity="0.85"/>
  <text x="286" y="215" font-size="12" fill="#ffffff" text-anchor="middle">fit</text>
  <rect x="423" y="196" width="91" height="28" fill="#a8955a" fill-opacity="0.9"/>
  <text x="468" y="215" font-size="12" fill="#ffffff" text-anchor="middle">test</text>
  <text x="120" y="215" font-size="12" fill="#7a7f85" text-anchor="end">fold 1</text>
  <rect x="150" y="236" width="363" height="28" fill="#2471a3" fill-opacity="0.85"/>
  <text x="332" y="255" font-size="12" fill="#ffffff" text-anchor="middle">fit</text>
  <rect x="513" y="236" width="91" height="28" fill="#a8955a" fill-opacity="0.9"/>
  <text x="559" y="255" font-size="12" fill="#ffffff" text-anchor="middle">test</text>
  <text x="120" y="255" font-size="12" fill="#7a7f85" text-anchor="end">fold 2</text>
  <rect x="150" y="276" width="454" height="28" fill="#2471a3" fill-opacity="0.85"/>
  <text x="377" y="295" font-size="12" fill="#ffffff" text-anchor="middle">fit</text>
  <rect x="604" y="276" width="91" height="28" fill="#a8955a" fill-opacity="0.9"/>
  <text x="650" y="295" font-size="12" fill="#ffffff" text-anchor="middle">test</text>
  <text x="120" y="295" font-size="12" fill="#7a7f85" text-anchor="end">fold 3</text>
  <rect x="150" y="316" width="545" height="28" fill="#2471a3" fill-opacity="0.85"/>
  <text x="423" y="335" font-size="12" fill="#ffffff" text-anchor="middle">fit</text>
  <rect x="695" y="316" width="91" height="28" fill="#a8955a" fill-opacity="0.9"/>
  <text x="741" y="335" font-size="12" fill="#ffffff" text-anchor="middle">test</text>
  <text x="120" y="335" font-size="12" fill="#7a7f85" text-anchor="end">fold 4</text>
  <text x="150" y="376" font-size="12" fill="#7a7f85" text-anchor="middle">2018</text>
  <text x="241" y="376" font-size="12" fill="#7a7f85" text-anchor="middle">2019</text>
  <text x="332" y="376" font-size="12" fill="#7a7f85" text-anchor="middle">2020</text>
  <text x="423" y="376" font-size="12" fill="#7a7f85" text-anchor="middle">2021</text>
  <text x="513" y="376" font-size="12" fill="#7a7f85" text-anchor="middle">2022</text>
  <text x="604" y="376" font-size="12" fill="#7a7f85" text-anchor="middle">2023</text>
  <text x="695" y="376" font-size="12" fill="#7a7f85" text-anchor="middle">2024</text>
  <text x="786" y="376" font-size="12" fill="#7a7f85" text-anchor="middle">2025</text>
  <line x1="150" y1="356" x2="786" y2="356" stroke="#c9c4b8"/>
  <text x="800" y="262" font-size="13" font-weight="700" fill="#1e8449">four out-of-sample</text>
  <text x="800" y="280" font-size="13" font-weight="700" fill="#1e8449">numbers, and the</text>
  <text x="800" y="298" font-size="13" font-weight="700" fill="#1e8449">spread between them</text>
</svg>
