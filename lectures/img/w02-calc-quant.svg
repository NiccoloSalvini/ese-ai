  <line x1="30" y1="276" x2="970" y2="276" stroke="#e6e2d8"/>
  <text x="30" y="291" font-size="14" font-weight="700" fill="#363636" text-anchor="start" >weight 8</text>
  <text x="150" y="291" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.0098</text>
  <text x="340" y="291" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.16</text>
  <text x="570" y="291" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0</text>
  <text x="780" y="291" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.0000</text>
  <line x1="30" y1="303" x2="970" y2="303" stroke="#e6e2d8"/>
  <text x="30" y="332" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >Allowed values: 0, ±0.5, ±1, ±1.5, ±2, ±3, ±4, ±6 — 16 of them, so 4 bits. Every 32 weights share one scale (8 bits).</text>
  <text x="30" y="356" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >4 + 8/32 = 4.25 bits instead of 16. For 117 billion weights: 234 GB → 62.2 GB.</text>
</svg>