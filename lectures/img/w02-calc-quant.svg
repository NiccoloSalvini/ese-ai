  <text x="150" y="102" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.0942</text>
  <text x="340" y="102" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">1.51</text>
  <text x="570" y="102" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">1.5</text>
  <text x="780" y="102" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.0938</text>
  <line x1="30" y1="114" x2="970" y2="114" stroke="#e6e2d8"/>
  <text x="30" y="129" font-size="14" font-weight="700" fill="#363636" text-anchor="start" >weight 2</text>
  <text x="150" y="129" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−0.1265</text>
  <text x="340" y="129" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−2.02</text>
  <text x="570" y="129" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−2</text>
  <text x="780" y="129" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−0.1250</text>
  <line x1="30" y1="141" x2="970" y2="141" stroke="#e6e2d8"/>
  <text x="30" y="156" font-size="14" font-weight="700" fill="#363636" text-anchor="start" >weight 3</text>
  <text x="150" y="156" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.0496</text>
