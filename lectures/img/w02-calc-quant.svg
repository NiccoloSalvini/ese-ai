<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 386" width="960" height="386" font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif">
  <text x="30" y="34" font-size="13" fill="#7a7f85">quantization by hand — 8 real weights of GPT-2 (block 1, MLP), squeezed into MXFP4</text>
  <text x="30" y="64" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1"></text>
  <text x="150" y="64" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1">stored in 16 bits</text>
  <text x="340" y="64" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1">÷ the block's scale 0.0625</text>
  <text x="570" y="64" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1">nearest of 16 values</text>
  <text x="780" y="64" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1">what is kept</text>
