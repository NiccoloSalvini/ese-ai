  <text x="570" y="156" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">1</text>
  <text x="780" y="156" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.0625</text>
  <line x1="30" y1="168" x2="970" y2="168" stroke="#e6e2d8"/>
  <text x="30" y="183" font-size="14" font-weight="700" fill="#363636" text-anchor="start" >weight 4</text>
  <text x="150" y="183" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−0.0116</text>
  <text x="340" y="183" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−0.19</text>
  <text x="570" y="183" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0</text>
  <text x="780" y="183" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.0000</text>
  <line x1="30" y1="195" x2="970" y2="195" stroke="#e6e2d8"/>
  <text x="30" y="210" font-size="14" font-weight="700" fill="#363636" text-anchor="start" >weight 5</text>
  <text x="150" y="210" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−0.0395</text>
  <text x="340" y="210" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−0.63</text>
  <text x="570" y="210" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−0.5</text>
  <text x="780" y="210" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">−0.0312</text>
  <line x1="30" y1="222" x2="970" y2="222" stroke="#e6e2d8"/>
  <text x="30" y="237" font-size="14" font-weight="700" fill="#363636" text-anchor="start" >weight 6</text>
  <text x="150" y="237" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.0513</text>
  <text x="340" y="237" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.82</text>
  <text x="570" y="237" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">1</text>
  <text x="780" y="237" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.0625</text>
  <line x1="30" y1="249" x2="970" y2="249" stroke="#e6e2d8"/>
  <text x="30" y="264" font-size="14" font-weight="700" fill="#363636" text-anchor="start" >weight 7</text>
  <text x="150" y="264" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0.3680</text>
  <text x="340" y="264" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">5.89</text>
  <text x="570" y="264" font-size="14" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">6</text>
