<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif">
  <text x="30" y="34" font-size="13" fill="#7a7f85">one artificial neuron, deciding whether to block a card payment &#8212; weights are illustrative</text>
  <rect x="30" y="71" width="200" height="44" fill="#f7f5ef" stroke="#e6e2d8"/>
  <text x="42" y="91" font-size="14" fill="#363636">log amount (scaled)</text>
  <text x="42" y="108" font-size="13" font-weight="700" fill="#2471a3">x = 1.2</text>
  <line x1="230" y1="95" x2="455" y2="175" stroke="#2471a3" stroke-width="2.3" stroke-opacity=".75"/>
  <text x="250" y="83" font-size="14" font-weight="700" fill="#AF1F25">w = 0.6</text>
  <rect x="30" y="151" width="200" height="44" fill="#f7f5ef" stroke="#e6e2d8"/>
  <text x="42" y="171" font-size="14" fill="#363636">paid abroad</text>
  <text x="42" y="188" font-size="13" font-weight="700" fill="#2471a3">x = 1</text>
  <line x1="230" y1="175" x2="455" y2="175" stroke="#2471a3" stroke-width="3.4" stroke-opacity=".75"/>
  <text x="250" y="163" font-size="14" font-weight="700" fill="#AF1F25">w = 1.1</text>
  <rect x="30" y="231" width="200" height="44" fill="#f7f5ef" stroke="#e6e2d8"/>
  <text x="42" y="251" font-size="14" fill="#363636">new device</text>
  <text x="42" y="268" font-size="13" font-weight="700" fill="#2471a3">x = 1</text>
  <line x1="230" y1="255" x2="455" y2="175" stroke="#2471a3" stroke-width="4.1" stroke-opacity=".75"/>
  <text x="250" y="281" font-size="14" font-weight="700" fill="#AF1F25">w = 1.4</text>
  <circle cx="500" cy="175" r="46" fill="#fff" stroke="#363636" stroke-width="2"/>
  <text x="500" y="170" font-size="26" text-anchor="middle" fill="#363636">&#931;</text>
  <text x="500" y="194" font-size="12" text-anchor="middle" fill="#7a7f85">bias -2</text>
  <line x1="546" y1="175" x2="630" y2="175" stroke="#363636" stroke-width="2"/>
  <text x="588" y="163" font-size="13" text-anchor="middle" fill="#363636">1.22</text>
  <rect x="630" y="140" width="110" height="70" fill="#fff" stroke="#363636" stroke-width="2"/>
  <path d="M640,200 C680,200 690,150 730,150" fill="none" stroke="#a8955a" stroke-width="3"/>
  <text x="685" y="228" font-size="12" text-anchor="middle" fill="#7a7f85">squash to 0&#8211;1</text>
  <line x1="740" y1="175" x2="800" y2="175" stroke="#363636" stroke-width="2"/>
  <text x="810" y="170" font-size="30" font-weight="700" fill="#AF1F25">0.77</text>
  <text x="810" y="194" font-size="13" fill="#363636">chance of fraud</text>
  <line x1="30" y1="300" x2="930" y2="300" stroke="#e6e2d8"/>
  <text x="30" y="328" font-size="15" fill="#363636">Multiply, add, squash. <tspan font-weight="700">The weights are the only thing it learns</tspan> &#8212; here 3 of them and a bias: 4 numbers.</text>
  <text x="30" y="352" font-size="15" fill="#363636">With the squash, this one neuron is exactly a logistic regression. You have seen it before under another name.</text>
</svg>