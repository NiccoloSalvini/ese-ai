<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="30" y="34" font-size="13" fill="#7a7f85">three things a vendor can mean by it &#8212; not close in cost, and not close in what they change</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8955a"/>
    </marker>
  </defs>

  <!-- lane 1 : prompt -->
  <text x="30" y="76" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">PUT IT IN THE PROMPT</text>
  <rect x="30" y="86" width="130" height="50" rx="3" fill="#fcfbf8" stroke="#c9c4b8"/>
  <text x="95" y="116" font-size="14" fill="#363636" text-anchor="middle">your documents</text>
  <line x1="166" y1="111" x2="200" y2="111" stroke="#a8955a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="208" y="86" width="150" height="50" rx="3" fill="#fcfbf8" stroke="#c9c4b8"/>
  <text x="283" y="116" font-size="14" fill="#363636" text-anchor="middle">the context window</text>
  <line x1="364" y1="111" x2="398" y2="111" stroke="#a8955a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="406" y="86" width="130" height="50" rx="3" fill="#ffffff" stroke="#7a7f85" stroke-width="2"/>
  <text x="471" y="108" font-size="14" font-weight="700" fill="#363636" text-anchor="middle">the model</text>
  <text x="471" y="126" font-size="12" fill="#7a7f85" text-anchor="middle">unchanged</text>
  <text x="580" y="100" font-size="13" fill="#363636">changes <tspan font-weight="700">nothing, ever</tspan></text>
  <text x="580" y="119" font-size="13" fill="#7a7f85">paid again on every single call</text>
  <text x="580" y="136" font-size="13" fill="#7a7f85">live in <tspan fill="#363636" font-weight="700">seconds</tspan></text>

  <line x1="30" y1="163" x2="930" y2="163" stroke="#e6e2d8"/>

  <!-- lane 2 : retrieval -->
  <text x="30" y="196" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">RETRIEVAL</text>
  <rect x="30" y="206" width="130" height="50" rx="3" fill="#fcfbf8" stroke="#c9c4b8"/>
  <text x="95" y="236" font-size="14" fill="#363636" text-anchor="middle">your documents</text>
  <line x1="166" y1="231" x2="200" y2="231" stroke="#a8955a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="208" y="206" width="150" height="50" rx="3" fill="#eaf1f7" stroke="#2471a3"/>
  <text x="283" y="229" font-size="14" font-weight="700" fill="#2471a3" text-anchor="middle">an index</text>
  <text x="283" y="246" font-size="12" fill="#2471a3" text-anchor="middle">searched at question time</text>
  <line x1="364" y1="231" x2="398" y2="231" stroke="#a8955a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="406" y="206" width="130" height="50" rx="3" fill="#ffffff" stroke="#7a7f85" stroke-width="2"/>
  <text x="471" y="228" font-size="14" font-weight="700" fill="#363636" text-anchor="middle">the model</text>
  <text x="471" y="246" font-size="12" fill="#7a7f85" text-anchor="middle">still unchanged</text>
  <text x="580" y="220" font-size="13" fill="#363636">changes <tspan font-weight="700">what it can look up</tspan></text>
  <text x="580" y="239" font-size="13" fill="#7a7f85">an index to build, plus per call</text>
  <text x="580" y="256" font-size="13" fill="#7a7f85">live in <tspan fill="#363636" font-weight="700">days</tspan></text>

  <line x1="30" y1="283" x2="930" y2="283" stroke="#e6e2d8"/>

  <!-- lane 3 : fine-tuning -->
  <text x="30" y="316" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">FINE-TUNING</text>
  <rect x="30" y="326" width="130" height="50" rx="3" fill="#fcfbf8" stroke="#c9c4b8"/>
  <text x="95" y="356" font-size="14" fill="#363636" text-anchor="middle">your documents</text>
  <line x1="166" y1="351" x2="200" y2="351" stroke="#a8955a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="208" y="326" width="150" height="50" rx="3" fill="#faeeee" stroke="#AF1F25"/>
  <text x="283" y="356" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="middle">a training run</text>
  <line x1="364" y1="351" x2="398" y2="351" stroke="#a8955a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="406" y="326" width="130" height="50" rx="3" fill="#ffffff" stroke="#AF1F25" stroke-width="2"/>
  <text x="471" y="348" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="middle">the model</text>
  <text x="471" y="366" font-size="12" fill="#AF1F25" text-anchor="middle">weights changed</text>
  <text x="580" y="340" font-size="13" fill="#363636">changes <tspan font-weight="700">how it says things</tspan></text>
  <text x="580" y="359" font-size="13" fill="#7a7f85">a training run, repeated</text>
  <text x="580" y="376" font-size="13" fill="#7a7f85">live in <tspan fill="#363636" font-weight="700">weeks</tspan></text>
</svg>
