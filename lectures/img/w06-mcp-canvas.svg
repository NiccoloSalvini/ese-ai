<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="390" fill="#ffffff"/>
  <defs><marker id="mcg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a8955a"/></marker><marker id="mcr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#AF1F25"/></marker><marker id="mcn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2471a3"/></marker><marker id="mce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e8449"/></marker><marker id="mcm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a7f85"/></marker></defs>
  <text x="30" y="34" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="start">seven boxes, laid out as the server works &#183; fill each one with your case, the numbers on the arrows</text>
  <rect x="20" y="60" width="200" height="150" rx="3" fill="#f6f1e3" stroke="#a8955a" stroke-width="1.5"/>
  <text x="34" y="86" font-size="13" font-weight="700" fill="#a8955a" text-anchor="start">1 &#183; THE JOB</text>
  <text x="34" y="110" font-size="13" font-weight="400" fill="#363636" text-anchor="start">who asks what?</text>
  <text x="34" y="129" font-size="13" font-weight="400" fill="#363636" text-anchor="start">how often?</text>
  <text x="34" y="148" font-size="13" font-weight="400" fill="#363636" text-anchor="start">what does a wrong</text>
  <text x="34" y="167" font-size="13" font-weight="400" fill="#363636" text-anchor="start">answer cost?</text>
  <rect x="252" y="60" width="170" height="150" rx="3" fill="#fcfbf8" stroke="#363636" stroke-width="1.5"/>
  <text x="266" y="86" font-size="13" font-weight="700" fill="#363636" text-anchor="start">THE ASSISTANT</text>
  <text x="266" y="110" font-size="13" font-weight="400" fill="#363636" text-anchor="start">Claude, ChatGPT&#8230;</text>
  <text x="266" y="129" font-size="13" font-weight="400" fill="#363636" text-anchor="start">which model?</text>
  <text x="266" y="148" font-size="13" font-weight="400" fill="#363636" text-anchor="start">its two prices</text>
  <rect x="480" y="60" width="240" height="150" rx="3" fill="#eaf1f7" stroke="#2471a3" stroke-width="1.5"/>
  <text x="494" y="86" font-size="13" font-weight="700" fill="#2471a3" text-anchor="start">2 &#183; THE MCP SERVER</text>
  <text x="494" y="110" font-size="13" font-weight="400" fill="#363636" text-anchor="start">three tools at most:</text>
  <text x="494" y="129" font-size="13" font-weight="400" fill="#363636" text-anchor="start">what goes in, what comes out</text>
  <text x="494" y="148" font-size="13" font-weight="400" fill="#363636" text-anchor="start">reads only, or writes?</text>
  <text x="494" y="167" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">get_supply(coin, day) &#8594; $</text>
  <rect x="760" y="60" width="180" height="150" rx="3" fill="#eaf4ee" stroke="#1e8449" stroke-width="1.5"/>
  <text x="774" y="86" font-size="13" font-weight="700" fill="#1e8449" text-anchor="start">3 &#183; THE SOURCE</text>
  <text x="774" y="110" font-size="13" font-weight="400" fill="#363636" text-anchor="start">an open API, or</text>
  <text x="774" y="129" font-size="13" font-weight="400" fill="#363636" text-anchor="start">documents</text>
  <text x="774" y="148" font-size="13" font-weight="400" fill="#363636" text-anchor="start">who owns it?</text>
  <text x="774" y="167" font-size="13" font-weight="400" fill="#363636" text-anchor="start">open today?</text>
  <rect x="20" y="240" width="200" height="130" rx="3" fill="#fcfbf8" stroke="#363636" stroke-width="1.5"/>
  <text x="34" y="266" font-size="13" font-weight="700" fill="#363636" text-anchor="start">7 &#183; THE TEST</text>
  <text x="34" y="290" font-size="13" font-weight="400" fill="#363636" text-anchor="start">five questions, answers</text>
  <text x="34" y="309" font-size="13" font-weight="400" fill="#363636" text-anchor="start">found by hand; the rival:</text>
  <text x="34" y="328" font-size="13" font-weight="400" fill="#363636" text-anchor="start">the assistant without</text>
  <text x="34" y="347" font-size="13" font-weight="400" fill="#363636" text-anchor="start">your server</text>
  <rect x="252" y="240" width="170" height="130" rx="3" fill="#f6f1e3" stroke="#a8955a" stroke-width="1.5"/>
  <text x="266" y="266" font-size="13" font-weight="700" fill="#a8955a" text-anchor="start">5 &#183; THE BILL</text>
  <text x="266" y="290" font-size="13" font-weight="400" fill="#363636" text-anchor="start">tokens in + out for</text>
  <text x="266" y="309" font-size="13" font-weight="400" fill="#363636" text-anchor="start">one question &#215; prices</text>
  <text x="266" y="328" font-size="13" font-weight="400" fill="#363636" text-anchor="start">&#215; your volume</text>
  <text x="266" y="347" font-size="13" font-weight="400" fill="#363636" text-anchor="start">= &#8364; a month</text>
  <rect x="480" y="240" width="240" height="130" rx="3" fill="#eaf1f7" stroke="#2471a3" stroke-width="1.5"/>
  <text x="494" y="266" font-size="13" font-weight="700" fill="#2471a3" text-anchor="start">4 &#183; WHERE IT RUNS</text>
  <text x="494" y="290" font-size="13" font-weight="400" fill="#363636" text-anchor="start">your laptop, or a server?</text>
  <text x="494" y="309" font-size="13" font-weight="400" fill="#363636" text-anchor="start">who can reach it?</text>
  <text x="494" y="328" font-size="13" font-weight="400" fill="#363636" text-anchor="start">&#8364; a month to keep it up</text>
  <rect x="760" y="240" width="180" height="130" rx="3" fill="#faeeee" stroke="#AF1F25" stroke-width="1.5"/>
  <text x="774" y="266" font-size="13" font-weight="700" fill="#AF1F25" text-anchor="start">6 &#183; THE DOORS</text>
  <text x="774" y="290" font-size="13" font-weight="400" fill="#363636" text-anchor="start">what could a tool's</text>
  <text x="774" y="309" font-size="13" font-weight="400" fill="#363636" text-anchor="start">answer smuggle in?</text>
  <text x="774" y="328" font-size="13" font-weight="400" fill="#363636" text-anchor="start">what must it</text>
  <text x="774" y="347" font-size="13" font-weight="400" fill="#363636" text-anchor="start">never do?</text>
  <line x1="222" y1="135" x2="248" y2="135" stroke="#a8955a" stroke-width="2" marker-end="url(#mcg)"/>
  <line x1="424" y1="118" x2="476" y2="118" stroke="#2471a3" stroke-width="2" marker-end="url(#mcn)"/>
  <text x="450" y="110" font-size="11" font-weight="400" fill="#2471a3" text-anchor="middle">a call</text>
  <line x1="478" y1="156" x2="426" y2="156" stroke="#2471a3" stroke-width="2" marker-end="url(#mcn)"/>
  <text x="452" y="174" font-size="11" font-weight="400" fill="#2471a3" text-anchor="middle">text back</text>
  <line x1="722" y1="135" x2="756" y2="135" stroke="#1e8449" stroke-width="2" marker-end="url(#mce)"/>
  <line x1="120" y1="212" x2="120" y2="238" stroke="#7a7f85" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="337" y1="212" x2="337" y2="238" stroke="#7a7f85" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="600" y1="212" x2="600" y2="238" stroke="#7a7f85" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="850" y1="212" x2="850" y2="238" stroke="#AF1F25" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
