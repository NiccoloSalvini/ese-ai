<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" width="960" height="418" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="418" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a8955a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#AF1F25"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2471a3"/></marker>
  </defs>
  <text x="30" y="34" font-size="13" fill="#7a7f85">the loop from session 5, one box longer — and the new box has no undo</text>
  <rect x="30" y="96" width="160" height="78" rx="3" fill="#eaf1f7" stroke="#2471a3" stroke-width="2"/>
  <text x="110.0" y="132.0" font-size="16" font-weight="700" fill="#2471a3" text-anchor="middle">the model</text>
  <text x="110.0" y="152.0" font-size="13" font-weight="400" fill="#2471a3" text-anchor="middle">reads the invoice</text>
  <line x1="196" y1="135" x2="244" y2="135" stroke="#a8955a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="220" y="62" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">it asks</text>
  <text x="220" y="80" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">pay(supplier, 4,200 USDT)</text>
  <rect x="250" y="96" width="180" height="78" rx="3" fill="#faeeee" stroke="#AF1F25" stroke-width="2"/>
  <text x="340.0" y="132.0" font-size="16" font-weight="700" fill="#AF1F25" text-anchor="middle">the harness</text>
  <text x="340.0" y="152.0" font-size="13" font-weight="400" fill="#AF1F25" text-anchor="middle">your rules decide</text>
  <line x1="436" y1="135" x2="484" y2="135" stroke="#a8955a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="460" y="125" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">yes</text>
  <rect x="490" y="96" width="150" height="78" rx="3" fill="#f7f2e4" stroke="#a8955a" stroke-width="2"/>
  <text x="565.0" y="132.0" font-size="16" font-weight="700" fill="#a8955a" text-anchor="middle">the key</text>
  <text x="565.0" y="152.0" font-size="13" font-weight="400" fill="#363636" text-anchor="middle">the wallet signs</text>
  <line x1="646" y1="135" x2="694" y2="135" stroke="#a8955a" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="700" y="96" width="230" height="78" rx="3" fill="#363636" stroke="#363636" stroke-width="2"/>
  <text x="815.0" y="132.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">the network</text>
  <text x="815.0" y="152.0" font-size="13" font-weight="400" fill="#e6e2d8" text-anchor="middle">in a block · final</text>
  <line x1="668" y1="58" x2="668" y2="200" stroke="#AF1F25" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="658" y="218" font-size="13" font-weight="700" fill="#1e8449" text-anchor="end">you can still say no</text>
  <text x="678" y="218" font-size="13" font-weight="700" fill="#AF1F25" text-anchor="start">no undo</text>
  <text x="30" y="256" font-size="12" font-weight="700" fill="#a8955a" text-anchor="start" letter-spacing="1.1">IF IT WAS A MISTAKE</text>
  <rect x="30" y="268" width="280" height="100" rx="3" fill="#fcfbf8" stroke="#c9c4b8" stroke-width="1"/>
  <text x="48" y="296" font-size="15" font-weight="700" fill="#363636" text-anchor="start">a card payment</text>
  <text x="48" y="320" font-size="13" font-weight="400" fill="#363636" text-anchor="start">the bank can pull it back</text>
  <text x="48" y="340" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">a chargeback, weeks later</text>
  <rect x="340" y="268" width="280" height="100" rx="3" fill="#fcfbf8" stroke="#c9c4b8" stroke-width="1"/>
  <text x="358" y="296" font-size="15" font-weight="700" fill="#363636" text-anchor="start">a bank transfer</text>
  <text x="358" y="320" font-size="13" font-weight="400" fill="#363636" text-anchor="start">you can ask for a recall</text>
  <text x="358" y="340" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">and since Oct 2025 the name is checked first</text>
  <rect x="650" y="268" width="280" height="100" rx="3" fill="#faeeee" stroke="#AF1F25" stroke-width="1.5"/>
  <text x="668" y="296" font-size="15" font-weight="700" fill="#AF1F25" text-anchor="start">a transfer on-chain</text>
  <text x="668" y="320" font-size="13" font-weight="400" fill="#363636" text-anchor="start">nobody to call</text>
  <text x="668" y="340" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">“There is no Bitcoin help desk.”</text>
  <text x="668" y="357" font-size="11" font-weight="400" fill="#7a7f85" text-anchor="start">— Andreas Antonopoulos</text>
  <text x="30" y="402" font-size="15" font-weight="700" fill="#363636" text-anchor="start">Every control you will ever have sits to the left of the red line.</text>
</svg>
