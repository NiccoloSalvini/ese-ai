<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="30" y="34" font-size="13" fill="#7a7f85">measured, not felt &#8212; and stated against a target you set before you built it</text>
  <rect x="40.0" y="110" width="29.3" height="46" fill="#2471a3" fill-opacity="0.9"/>
  <rect x="69.3" y="110" width="97.8" height="46" fill="#a8955a" fill-opacity="0.9"/>
  <text x="118.2" y="139" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">400 ms</text>
  <rect x="167.1" y="110" width="611.1" height="46" fill="#AF1F25" fill-opacity="0.9"/>
  <text x="472.7" y="139" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2500 ms</text>
  <rect x="778.2" y="110" width="44.0" height="46" fill="#7a7f85" fill-opacity="0.9"/>
  <text x="54.7" y="182" font-size="12" fill="#2471a3" text-anchor="middle">retrieval</text>
  <text x="118.2" y="204" font-size="12" fill="#a8955a" text-anchor="middle">time to first token</text>
  <text x="472.7" y="182" font-size="12" fill="#AF1F25" text-anchor="middle">generation, 200 tokens at 80 tok/s</text>
  <text x="800.2" y="204" font-size="12" fill="#7a7f85" text-anchor="middle">your own code</text>
  <line x1="528.9" y1="92" x2="528.9" y2="170" stroke="#363636" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="528.9" y="86" font-size="13" font-weight="700" fill="#363636" text-anchor="middle">target 2000 ms</text>
  <text x="832.2" y="139" font-size="15" font-weight="700" fill="#AF1F25">3,200 ms</text>
  <text x="40" y="250" font-size="16" font-weight="700" fill="#AF1F25">Over budget by 1,200 ms, and 78% of it is one thing.</text>
  <text x="40" y="278" font-size="14" fill="#363636">Cut the answer to 80 tokens and generation falls to 1,000 ms: <tspan font-weight="700" fill="#1e8449">1,700 ms, inside the target</tspan>.</text>
  <text x="40" y="304" font-size="14" fill="#7a7f85">Which is a product decision about how long an answer should be &#8212; not an engineering one.</text>
</svg>
