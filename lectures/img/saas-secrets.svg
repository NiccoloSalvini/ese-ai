<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="410" fill="#ffffff"/>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a8955a"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#AF1F25"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2471a3"/></marker>
  </defs>
  <text x="30" y="34" font-size="13" fill="#7a7f85">what each side may hold</text>
  <line x1="480" y1="60" x2="480" y2="330" stroke="#AF1F25" stroke-width="3"/>
  <text x="480" y="54" font-size="13" font-weight="700" fill="#AF1F25" text-anchor="middle">the wall</text>
  <text x="255" y="82" font-size="12" font-weight="700" fill="#7a7f85" text-anchor="middle" letter-spacing="1.1">THE BROWSER — PUBLIC</text>
  <text x="705" y="82" font-size="12" font-weight="700" fill="#7a7f85" text-anchor="middle" letter-spacing="1.1">THE SERVER — PRIVATE</text>
  <rect x="40" y="100" width="410" height="62" rx="3" fill="#ffffff" stroke="#c9c4b8" stroke-width="1"/>
  <text x="245" y="128" font-size="14" font-weight="700" fill="#363636" text-anchor="middle">page code, labels, buttons</text>
  <text x="245" y="148" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">anyone can read it: right-click ▸ Inspect</text>
  <rect x="40" y="174" width="410" height="62" rx="3" fill="#ffffff" stroke="#c9c4b8" stroke-width="1"/>
  <text x="245" y="202" font-size="14" font-weight="700" fill="#363636" text-anchor="middle">the database’s public key</text>
  <text x="245" y="222" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">public by design — safe only if every row is checked (RLS)</text>
  <rect x="40" y="248" width="410" height="62" rx="3" fill="#ffffff" stroke="#c9c4b8" stroke-width="1"/>
  <text x="245" y="276" font-size="14" font-weight="700" fill="#363636" text-anchor="middle">the user’s login token</text>
  <text x="245" y="296" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">proves who they are; expires</text>
  <rect x="510" y="100" width="410" height="62" rx="3" fill="#faeeee" stroke="#AF1F25" stroke-width="2"/>
  <text x="715" y="128" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="middle">the LLM key</text>
  <text x="715" y="148" font-size="12" font-weight="400" fill="#AF1F25" text-anchor="middle">pays for every token</text>
  <rect x="510" y="174" width="410" height="62" rx="3" fill="#faeeee" stroke="#AF1F25" stroke-width="2"/>
  <text x="715" y="202" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="middle">the Stripe secret key</text>
  <text x="715" y="222" font-size="12" font-weight="400" fill="#AF1F25" text-anchor="middle">can refund, can charge</text>
  <rect x="510" y="248" width="410" height="62" rx="3" fill="#faeeee" stroke="#AF1F25" stroke-width="2"/>
  <text x="715" y="276" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="middle">the database admin key</text>
  <text x="715" y="296" font-size="12" font-weight="400" fill="#AF1F25" text-anchor="middle">bypasses every rule</text>
  <text x="30" y="370" font-size="14" font-weight="400" fill="#363636" text-anchor="start">The browser asks; the server calls with the key. A key in the frontend is a key on the internet —</text>
  <text x="30" y="392" font-size="14" font-weight="400" fill="#363636" text-anchor="start">the same rule as this morning’s getpass box, and the first thing to check in any app an AI built for you.</text>
</svg>