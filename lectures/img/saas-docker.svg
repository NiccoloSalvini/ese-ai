  <text x="64" y="238" font-size="13" font-weight="700" fill="#363636" text-anchor="start">the settings</text>
  <text x="276" y="238" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace">PRICES_URL</text>
