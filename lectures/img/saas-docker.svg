  <text x="684" y="238" font-size="13" font-weight="700" fill="#363636" text-anchor="start">the settings</text>
  <text x="896" y="238" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace">PRICES_URL</text>
  <text x="790" y="284" font-size="14" font-weight="700" fill="#363636" text-anchor="middle">a server in Frankfurt</text>
  <line x1="312" y1="140" x2="646" y2="140" stroke="#a8955a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="479" y="128" font-size="14" font-weight="700" fill="#363636" text-anchor="middle">the same box, byte for byte</text>
  <text x="479" y="162" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">docker build → push → run</text>
  <rect x="360" y="200" width="240" height="66" rx="3" fill="#ffffff" stroke="#c9c4b8" stroke-width="1"/>
  <text x="480" y="221" font-size="14" font-weight="700" fill="#363636" text-anchor="middle">image vs container</text>
  <text x="480" y="241" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">image: the frozen box</text>
  <text x="480" y="258" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">container: a running copy</text>
  <text x="30" y="340" font-size="14" font-weight="400" fill="#363636" text-anchor="start">“It works on my machine” — so ship the machine. Docker packs your code with everything it needs to run,</text>
  <text x="30" y="362" font-size="14" font-weight="400" fill="#363636" text-anchor="start">and any cloud can run the box without knowing what is inside. Most platforms on the next slide take one.</text>
