  <text x="684" y="130" font-size="13" font-weight="700" fill="#363636" text-anchor="start">your code</text>
  <text x="896" y="130" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace">volalert/job.py</text>
  <rect x="674" y="146" width="232" height="30" fill="#ffffff" stroke="#c9c4b8"/>
  <text x="684" y="166" font-size="13" font-weight="700" fill="#363636" text-anchor="start">the language</text>
  <text x="896" y="166" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace">Python 3.12</text>
  <rect x="674" y="182" width="232" height="30" fill="#ffffff" stroke="#c9c4b8"/>
  <text x="684" y="202" font-size="13" font-weight="700" fill="#363636" text-anchor="start">the libraries</text>
  <text x="896" y="202" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace">pandas · sklearn</text>
