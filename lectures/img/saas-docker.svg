  <text x="276" y="166" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end" font-family="'JetBrains Mono',Menlo,monospace">Python 3.12</text>
  <rect x="54" y="182" width="232" height="30" fill="#ffffff" stroke="#c9c4b8"/>
