<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="390" fill="#ffffff"/>
  <defs><marker id="lng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a8955a"/></marker><marker id="lnr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#AF1F25"/></marker><marker id="lnn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2471a3"/></marker><marker id="lne" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e8449"/></marker><marker id="lnm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a7f85"/></marker></defs>
  <text x="30" y="34" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="start">you lock $10,000 of ETH and borrow $7,000 of USDC &#183; the protocol liquidates when the debt passes 80% of the collateral</text>
  <rect x="322.5" y="80" width="297.5" height="250" fill="#faeeee"/>
  <line x1="110" y1="80" x2="110" y2="330" stroke="#c9c4b8" stroke-width="1"/>
  <line x1="110" y1="330" x2="620" y2="330" stroke="#c9c4b8" stroke-width="1"/>
  <line x1="110.0" y1="330" x2="110.0" y2="335" stroke="#c9c4b8" stroke-width="1"/>
  <text x="110.0" y="350" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">0</text>
  <line x1="280.0" y1="330" x2="280.0" y2="335" stroke="#c9c4b8" stroke-width="1"/>
  <text x="280.0" y="350" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">10%</text>
  <line x1="450.00000000000006" y1="330" x2="450.00000000000006" y2="335" stroke="#c9c4b8" stroke-width="1"/>
  <text x="450.00000000000006" y="350" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">20%</text>
  <line x1="620.0" y1="330" x2="620.0" y2="335" stroke="#c9c4b8" stroke-width="1"/>
  <text x="620.0" y="350" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">30%</text>
  <line x1="105" y1="288.3333333333333" x2="110" y2="288.3333333333333" stroke="#c9c4b8" stroke-width="1"/>
  <text x="100" y="292.3333333333333" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end">$6,000</text>
  <line x1="105" y1="205.0" x2="110" y2="205.0" stroke="#c9c4b8" stroke-width="1"/>
  <text x="100" y="209.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end">$8,000</text>
  <line x1="105" y1="121.66666666666666" x2="110" y2="121.66666666666666" stroke="#c9c4b8" stroke-width="1"/>
  <text x="100" y="125.66666666666666" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end">$10,000</text>
  <line x1="110" y1="246.66666666666669" x2="620" y2="246.66666666666669" stroke="#7a7f85" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="616" y="264.6666666666667" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="end">your debt: $7,000</text>
  <line x1="110" y1="173.75" x2="620" y2="173.75" stroke="#AF1F25" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="616" y="165.75" font-size="13" font-weight="700" fill="#AF1F25" text-anchor="end">debt &#247; 80% = $8,750</text>
  <line x1="110.0" y1="121.66666666666666" x2="620.0" y2="246.66666666666669" stroke="#2471a3" stroke-width="3"/>
  <text x="127.0" y="111.66666666666666" font-size="13" font-weight="700" fill="#2471a3" text-anchor="start">your collateral: $10,000 of ETH</text>
  <circle cx="322.5" cy="173.8" r="7" fill="#AF1F25"/>
  <line x1="322.5" y1="181.75" x2="322.5" y2="330" stroke="#AF1F25" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="322.5" y="368" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="middle">&#8722;12.5%</text>
  <text x="475.5" y="102" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="middle">the code sells</text>
  <text x="620" y="370" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="end">fall in the price of ETH</text>
  <line x1="660" y1="70" x2="660" y2="350" stroke="#e6e2d8" stroke-width="1"/>
  <text x="684" y="96" font-size="12" font-weight="700" fill="#a8955a" text-anchor="start">HEALTH FACTOR</text>
  <text x="684" y="136" font-size="34" font-weight="700" fill="#2471a3" text-anchor="start">1.14</text>
  <text x="684" y="160" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="start">= $10,000 &#215; 80% &#247; $7,000</text>
  <text x="684" y="204" font-size="14" font-weight="400" fill="#363636" text-anchor="start">below 1.00, anyone may repay</text>
  <text x="684" y="224" font-size="14" font-weight="400" fill="#363636" text-anchor="start">your debt and take your ETH</text>
  <text x="684" y="244" font-size="14" font-weight="400" fill="#363636" text-anchor="start">at a discount</text>
  <text x="684" y="290" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="start">no phone call, no extension,</text>
  <text x="684" y="310" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="start">no banker</text>
</svg>
