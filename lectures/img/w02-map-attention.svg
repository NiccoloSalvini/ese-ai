  <rect x="50" y="184" width="440" height="124" fill="#f7f5ef" stroke="#363636" stroke-width="2"/>
  <text x="66" y="204" font-size="11" font-weight="700" fill="#a8955a" text-anchor="start" letter-spacing="1.2">ONE BLOCK</text>
  <rect x="66" y="214" width="408" height="38" fill="#fff" stroke="#AF1F25" stroke-width="2"/>
  <text x="270" y="238" font-size="15" font-weight="700" fill="#AF1F25" text-anchor="middle" >attention — tokens read each other</text>
  <rect x="66" y="260" width="408" height="38" fill="#fff" stroke="#d9d4c7" stroke-width="2"/>
  <text x="270" y="284" font-size="15" font-weight="700" fill="#b9b4a8" text-anchor="middle" >neurons — each token thinks on its own</text>
  <text x="270" y="330" font-size="15" font-weight="700" fill="#363636" text-anchor="middle" >× 12 in GPT-2 · × 36 in gpt-oss</text>
  <line x1="270" y1="338" x2="270" y2="360" stroke="#d9d4c7" stroke-width="1.8"/>
  <polygon points="270,360 266.5,351.7 273.5,351.7" fill="#d9d4c7"/>
  <rect x="50" y="362" width="440" height="38" fill="#fff" stroke="#d9d4c7" stroke-width="2"/>
  <text x="270" y="386" font-size="15" font-weight="700" fill="#b9b4a8" text-anchor="middle" >the knobs — a score for each of 50,257 pieces</text>
  <text x="530" y="102" font-size="15" font-weight="400" fill="#b9b4a8" text-anchor="start" >① tokens</text>
  <text x="530" y="120" font-size="13" font-weight="400" fill="#b9b4a8" text-anchor="start" font-style="italic">“tokenized … o200k”</text>
  <text x="530" y="154" font-size="15" font-weight="400" fill="#b9b4a8" text-anchor="start" >② vectors: a place on the map</text>
  <text x="530" y="238" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >③ attention</text>
  <text x="530" y="256" font-size="13" font-weight="400" fill="#AF1F25" text-anchor="start" font-style="italic">“Transformer”</text>
  <text x="530" y="284" font-size="15" font-weight="400" fill="#b9b4a8" text-anchor="start" >④ neurons: most of the parameters live here</text>
  <text x="530" y="302" font-size="13" font-weight="400" fill="#b9b4a8" text-anchor="start" font-style="italic">“117b” · “MoE”</text>
  <text x="530" y="386" font-size="15" font-weight="400" fill="#b9b4a8" text-anchor="start" >⑤ knobs: pick one, append, repeat</text>
  <text x="530" y="404" font-size="13" font-weight="400" fill="#b9b4a8" text-anchor="start" font-style="italic">“temperature”</text>
