<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="30" y="34" font-size="13" fill="#7a7f85">1,000,000 transactions &#183; fraud is 0.5% of them &#183; one threshold, one matrix</text>
  <text x="390" y="86" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a" text-anchor="middle">WHAT THE MODEL SAID</text>
  <text x="295" y="108" font-size="13" fill="#7a7f85" text-anchor="middle">flagged</text>
  <text x="485" y="108" font-size="13" fill="#7a7f85" text-anchor="middle">not flagged</text>
  <text x="186" y="162" font-size="13" fill="#7a7f85" text-anchor="end">fraud</text>
  <text x="186" y="236" font-size="13" fill="#7a7f85" text-anchor="end">legitimate</text>
  <rect x="200" y="120" width="190" height="74" fill="#1e8449" fill-opacity="0.09" stroke="#1e8449"/>
  <text x="295" y="154" font-size="19" font-weight="700" fill="#1e8449" text-anchor="middle">3,500</text>
  <text x="295" y="175" font-size="12" fill="#1e8449" text-anchor="middle">caught</text>
  <rect x="390" y="120" width="190" height="74" fill="#AF1F25" fill-opacity="0.09" stroke="#AF1F25"/>
  <text x="485" y="154" font-size="19" font-weight="700" fill="#AF1F25" text-anchor="middle">1,500</text>
  <text x="485" y="175" font-size="12" fill="#AF1F25" text-anchor="middle">missed fraud</text>
  <rect x="200" y="194" width="190" height="74" fill="#AF1F25" fill-opacity="0.09" stroke="#AF1F25"/>
  <text x="295" y="228" font-size="19" font-weight="700" fill="#AF1F25" text-anchor="middle">9,950</text>
  <text x="295" y="249" font-size="12" fill="#AF1F25" text-anchor="middle">blocked a good customer</text>
  <rect x="390" y="194" width="190" height="74" fill="#7a7f85" fill-opacity="0.09" stroke="#7a7f85"/>
  <text x="485" y="228" font-size="19" font-weight="700" fill="#7a7f85" text-anchor="middle">985,050</text>
  <text x="485" y="249" font-size="12" fill="#7a7f85" text-anchor="middle">let through, correctly</text>
  <text x="200" y="304" font-size="15" font-weight="700" fill="#363636">precision 26.0%</text>
  <text x="200" y="322" font-size="12" fill="#7a7f85">of what we flagged, this much really was fraud</text>
  <text x="200" y="348" font-size="15" font-weight="700" fill="#363636">recall 70%</text>
  <text x="200" y="366" font-size="12" fill="#7a7f85">of the fraud out there, this much we caught</text>
  <text x="200" y="392" font-size="15" font-weight="700" fill="#363636">false positive rate 1%</text>
  <text x="200" y="410" font-size="12" fill="#7a7f85">of the good customers, 9,950 people blocked</text>
  <line x1="620" y1="86" x2="620" y2="404" stroke="#e6e2d8"/>
  <text x="648" y="124" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">THE ACCURACY TRAP</text>
  <text x="648" y="152" font-size="15" fill="#363636">this model &#160;<tspan font-weight="700">98.86%</tspan></text>
  <text x="648" y="176" font-size="15" fill="#AF1F25">flag nothing at all &#160;<tspan font-weight="700">99.50%</tspan></text>
  <text x="648" y="202" font-size="13" fill="#7a7f85">The useless model scores higher.</text>
  <text x="648" y="248" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">WHAT IT COSTS, IN EUROS</text>
  <text x="648" y="276" font-size="14" fill="#363636">9,950 &#215; &#8364;8 contact &#160;=&#160; &#8364;79,600</text>
  <text x="648" y="298" font-size="14" fill="#363636">1,500 &#215; &#8364;220 missed &#160;=&#160; &#8364;330,000</text>
  <line x1="648" y1="312" x2="920" y2="312" stroke="#c9c4b8"/>
  <text x="648" y="336" font-size="16" font-weight="700" fill="#AF1F25">&#8364;409,600</text>
  <text x="648" y="362" font-size="13" fill="#7a7f85">Sweep the threshold and minimise</text>
  <text x="648" y="379" font-size="13" fill="#7a7f85">this number. Not the accuracy.</text>
</svg>
