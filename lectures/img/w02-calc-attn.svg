  <text x="30" y="258" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >“rates” asks with its query [−1.03 −0.82 −2.29 −0.79 …] — multiply by each key, 64 pairs, and add: a neuron.</text>
  <text x="30" y="282" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >Into shares: e^ each score, divide by the total (1.513). 66% of what “rates” reads here comes from “ECB”.</text>
  <text x="30" y="306" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >Masked: “left” could not read “rates” — a token only sees the ones before it. 12 heads do this at once, in each of 12 blocks.</text>
