<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="30.0" y="34.0" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="start">ten sessions, one path, and at each stop the part no model takes off your hands</text>
  <text x="95.0" y="108.0" font-size="19" font-weight="700" fill="#a8955a" text-anchor="middle">a model</text>
  <circle cx="95" cy="150" r="24" fill="#ffffff" stroke="#a8955a" stroke-width="2.5"/>
  <text x="95.0" y="155.0" font-size="14" font-weight="700" fill="#a8955a" text-anchor="middle">1–2</text>
  <text x="95.0" y="200.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">one neuron to an LLM;</text>
  <text x="95.0" y="216.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">every token has a price</text>
  <text x="95.0" y="260.0" font-size="10" font-weight="700" fill="#a8955a" text-anchor="middle">STAYS YOURS</text>
  <rect x="29.0" y="270.0" width="132.0" height="40.0" rx="3" fill="#ffffff" stroke="#a8955a" stroke-width="2"/>
  <text x="95.0" y="296.0" font-size="16" font-weight="700" fill="#a8955a" text-anchor="middle">the bill</text>
  <line x1="121" y1="150" x2="223" y2="150" stroke="#CDBA80" stroke-width="3"/>
  <text x="249.0" y="108.0" font-size="19" font-weight="700" fill="#a8955a" text-anchor="middle">predict</text>
  <circle cx="249" cy="150" r="24" fill="#ffffff" stroke="#a8955a" stroke-width="2.5"/>
  <text x="249.0" y="155.0" font-size="12" font-weight="700" fill="#a8955a" text-anchor="middle">3 · mid</text>
  <text x="249.0" y="200.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">a black box against a</text>
  <text x="249.0" y="216.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">base rate; Q3 = Q2</text>
  <text x="249.0" y="260.0" font-size="10" font-weight="700" fill="#a8955a" text-anchor="middle">STAYS YOURS</text>
  <rect x="183.0" y="270.0" width="132.0" height="40.0" rx="3" fill="#ffffff" stroke="#a8955a" stroke-width="2"/>
  <text x="249.0" y="296.0" font-size="16" font-weight="700" fill="#a8955a" text-anchor="middle">the rival</text>
  <line x1="275" y1="150" x2="377" y2="150" stroke="#CDBA80" stroke-width="3"/>
  <text x="403.0" y="108.0" font-size="19" font-weight="700" fill="#2471a3" text-anchor="middle">read</text>
  <circle cx="403" cy="150" r="24" fill="#ffffff" stroke="#2471a3" stroke-width="2.5"/>
  <text x="403.0" y="155.0" font-size="12" font-weight="700" fill="#2471a3" text-anchor="middle">4 · 7</text>
  <text x="403.0" y="200.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">four boxes; a reserve</text>
  <text x="403.0" y="216.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">report; the hidden line</text>
  <text x="403.0" y="260.0" font-size="10" font-weight="700" fill="#a8955a" text-anchor="middle">STAYS YOURS</text>
  <rect x="337.0" y="270.0" width="132.0" height="40.0" rx="3" fill="#ffffff" stroke="#2471a3" stroke-width="2"/>
  <text x="403.0" y="296.0" font-size="16" font-weight="700" fill="#2471a3" text-anchor="middle">the test</text>
  <line x1="429" y1="150" x2="531" y2="150" stroke="#CDBA80" stroke-width="3"/>
  <text x="557.0" y="108.0" font-size="19" font-weight="700" fill="#2471a3" text-anchor="middle">look</text>
  <circle cx="557" cy="150" r="24" fill="#ffffff" stroke="#2471a3" stroke-width="2.5"/>
  <text x="557.0" y="155.0" font-size="14" font-weight="700" fill="#2471a3" text-anchor="middle">8</text>
  <text x="557.0" y="200.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">USDT on the ledger;</text>
  <text x="557.0" y="216.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">a supply that falls</text>
  <text x="557.0" y="260.0" font-size="10" font-weight="700" fill="#a8955a" text-anchor="middle">STAYS YOURS</text>
  <rect x="491.0" y="270.0" width="132.0" height="40.0" rx="3" fill="#ffffff" stroke="#2471a3" stroke-width="2"/>
  <text x="557.0" y="296.0" font-size="16" font-weight="700" fill="#2471a3" text-anchor="middle">the question</text>
  <line x1="583" y1="150" x2="685" y2="150" stroke="#CDBA80" stroke-width="3"/>
  <text x="711.0" y="108.0" font-size="19" font-weight="700" fill="#2471a3" text-anchor="middle">act</text>
  <circle cx="711" cy="150" r="24" fill="#ffffff" stroke="#2471a3" stroke-width="2.5"/>
  <text x="711.0" y="155.0" font-size="12" font-weight="700" fill="#2471a3" text-anchor="middle">5 · 9</text>
  <text x="711.0" y="200.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">the loop, the harness;</text>
  <text x="711.0" y="216.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">an agent that pays</text>
  <text x="711.0" y="260.0" font-size="10" font-weight="700" fill="#a8955a" text-anchor="middle">STAYS YOURS</text>
  <rect x="645.0" y="270.0" width="132.0" height="40.0" rx="3" fill="#ffffff" stroke="#2471a3" stroke-width="2"/>
  <text x="711.0" y="296.0" font-size="16" font-weight="700" fill="#2471a3" text-anchor="middle">the rules</text>
  <line x1="737" y1="150" x2="839" y2="150" stroke="#CDBA80" stroke-width="3"/>
  <text x="865.0" y="108.0" font-size="19" font-weight="700" fill="#AF1F25" text-anchor="middle">yours</text>
  <circle cx="865" cy="150" r="24" fill="#ffffff" stroke="#AF1F25" stroke-width="2.5"/>
  <text x="865.0" y="155.0" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="middle">10</text>
  <text x="865.0" y="200.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">the capstone,</text>
  <text x="865.0" y="216.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">Wednesday 9 December</text>
  <text x="865.0" y="260.0" font-size="10" font-weight="700" fill="#a8955a" text-anchor="middle">STAYS YOURS</text>
  <rect x="799.0" y="270.0" width="132.0" height="40.0" rx="3" fill="#AF1F25" stroke="#AF1F25" stroke-width="2"/>
  <text x="865.0" y="296.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">the signature</text>
  <text x="30.0" y="392.0" font-size="16" font-weight="700" fill="#363636" text-anchor="start">The models will do more every year. These six stay yours.</text>
</svg>