  <text x="30.0" y="425.0" font-size="14" font-weight="400" fill="#363636" text-anchor="start">Days with a move beyond k standard deviations, in 3,200 days of Bitcoin. The bell curve says a 4σ day is a once-in-40-years event.</text>
