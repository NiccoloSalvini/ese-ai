<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" width="960" height="355" font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif">
  <text x="30" y="34" font-size="13" fill="#7a7f85">how every neural network learns, from four weights to a hundred billion</text>
  <rect x="30" y="80" width="200" height="130" fill="#f7f5ef" stroke="#363636" stroke-width="2.5"/>
  <text x="130" y="118" font-size="19" font-weight="700" text-anchor="middle" fill="#363636">1 · guess</text>
  <text x="130" y="152" font-size="14" text-anchor="middle" fill="#363636">run the inputs through</text>
  <text x="130" y="174" font-size="14" text-anchor="middle" fill="#363636">the network</text>
  <line x1="232" y1="145" x2="254" y2="145" stroke="#363636" stroke-width="2"/>
  <polygon points="254,139 262,145 254,151" fill="#363636"/>
  <rect x="262" y="80" width="200" height="130" fill="#f7f5ef" stroke="#AF1F25" stroke-width="2.5"/>
  <text x="362" y="118" font-size="19" font-weight="700" text-anchor="middle" fill="#AF1F25">2 · how wrong?</text>
  <text x="362" y="152" font-size="14" text-anchor="middle" fill="#363636">compare with the right</text>
  <text x="362" y="174" font-size="14" text-anchor="middle" fill="#363636">answer: the loss</text>
  <line x1="464" y1="145" x2="486" y2="145" stroke="#363636" stroke-width="2"/>
  <polygon points="486,139 494,145 486,151" fill="#363636"/>
  <rect x="494" y="80" width="200" height="130" fill="#f7f5ef" stroke="#2471a3" stroke-width="2.5"/>
  <text x="594" y="118" font-size="19" font-weight="700" text-anchor="middle" fill="#2471a3">3 · who is to blame?</text>
  <text x="594" y="152" font-size="14" text-anchor="middle" fill="#363636">for every weight: does</text>
  <text x="594" y="174" font-size="14" text-anchor="middle" fill="#363636">nudging it help or hurt?</text>
  <line x1="696" y1="145" x2="718" y2="145" stroke="#363636" stroke-width="2"/>
  <polygon points="718,139 726,145 718,151" fill="#363636"/>
  <rect x="726" y="80" width="200" height="130" fill="#f7f5ef" stroke="#1e8449" stroke-width="2.5"/>
  <text x="826" y="118" font-size="19" font-weight="700" text-anchor="middle" fill="#1e8449">4 · nudge</text>
  <text x="826" y="152" font-size="14" text-anchor="middle" fill="#363636">move every weight a little</text>
  <text x="826" y="174" font-size="14" text-anchor="middle" fill="#363636">the helpful way</text>
  <path d="M825,212 C825,285 130,285 130,215" fill="none" stroke="#7a7f85" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="124,222 130,210 136,222" fill="#7a7f85"/>
  <text x="480" y="298" font-size="15" text-anchor="middle" fill="#7a7f85">repeat &#8212; a few rounds for the perceptron, trillions for an LLM</text>
  <text x="480" y="340" font-size="14" text-anchor="middle" fill="#363636">step 3 has a name: <tspan font-weight="700" fill="#2471a3">backpropagation</tspan></text>
</svg>