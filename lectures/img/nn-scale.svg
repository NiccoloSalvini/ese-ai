<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif">
  <text x="30" y="34" font-size="13" fill="#7a7f85">number of weights (parameters), on a log scale: every step to the right is ten times more</text>
  <text x="30" y="90" font-size="15" font-weight="700" fill="#363636">one neuron</text>
  <rect x="330" y="74" width="48" height="22" fill="#2471a3" fill-opacity=".85"/>
  <text x="388" y="91" font-size="15" font-weight="700" fill="#2471a3">4</text>
  <text x="388" y="108" font-size="12" fill="#7a7f85">the slide before</text>
  <text x="30" y="148" font-size="15" font-weight="700" fill="#363636">a small network, 2 &#8594; 5 &#8594; 1</text>
  <rect x="330" y="132" width="69" height="22" fill="#2471a3" fill-opacity=".85"/>
  <text x="409" y="149" font-size="15" font-weight="700" fill="#2471a3">21</text>
  <text x="409" y="166" font-size="12" fill="#7a7f85">the clip you just saw</text>
  <text x="30" y="206" font-size="15" font-weight="700" fill="#363636">GPT-2 small, 2019</text>
  <rect x="330" y="190" width="266" height="22" fill="#AF1F25" fill-opacity=".85"/>
  <text x="606" y="207" font-size="15" font-weight="700" fill="#AF1F25">124 million</text>
  <text x="606" y="224" font-size="12" fill="#7a7f85">small enough to train yourself</text>
  <text x="30" y="264" font-size="15" font-weight="700" fill="#363636">gpt-oss-20b, 2025</text>
  <rect x="330" y="248" width="331" height="22" fill="#AF1F25" fill-opacity=".85"/>
  <text x="671" y="265" font-size="15" font-weight="700" fill="#AF1F25">21 billion</text>
  <text x="671" y="282" font-size="12" fill="#7a7f85">fits in 16 GB of memory</text>
  <text x="30" y="322" font-size="15" font-weight="700" fill="#363636">gpt-oss-120b, 2025</text>
  <rect x="330" y="306" width="353" height="22" fill="#AF1F25" fill-opacity=".85"/>
  <text x="693" y="323" font-size="15" font-weight="700" fill="#AF1F25">117 billion</text>
  <text x="693" y="340" font-size="12" fill="#7a7f85">fits on one 80 GB GPU</text>
  <line x1="30" y1="370" x2="930" y2="370" stroke="#e6e2d8"/>
  <text x="30" y="396" font-size="15" fill="#363636">Same arithmetic in every one &#8212; multiply, add, squash. The only thing that changed is <tspan font-weight="700" fill="#AF1F25">how many weights</tspan>, and what they were trained on.</text>
</svg>