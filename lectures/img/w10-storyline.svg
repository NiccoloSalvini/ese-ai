<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="410" fill="#ffffff"/>
  <text x="30.0" y="34.0" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="start">fifteen minutes, six beats, from the brief</text>
  <line x1="40.0" y1="140" x2="40.0" y2="150" stroke="#7a7f85" stroke-width="1"/>
  <text x="40.0" y="134.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">0:00</text>
  <line x1="98.7" y1="145" x2="98.7" y2="150" stroke="#e6e2d8" stroke-width="1"/>
  <line x1="157.3" y1="140" x2="157.3" y2="150" stroke="#7a7f85" stroke-width="1"/>
  <text x="157.3" y="134.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">2:00</text>
  <line x1="216.0" y1="145" x2="216.0" y2="150" stroke="#e6e2d8" stroke-width="1"/>
  <line x1="274.7" y1="145" x2="274.7" y2="150" stroke="#e6e2d8" stroke-width="1"/>
  <line x1="333.3" y1="140" x2="333.3" y2="150" stroke="#7a7f85" stroke-width="1"/>
  <text x="333.3" y="134.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">5:00</text>
  <line x1="392.0" y1="145" x2="392.0" y2="150" stroke="#e6e2d8" stroke-width="1"/>
  <line x1="450.7" y1="145" x2="450.7" y2="150" stroke="#e6e2d8" stroke-width="1"/>
  <line x1="509.3" y1="140" x2="509.3" y2="150" stroke="#7a7f85" stroke-width="1"/>
  <text x="509.3" y="134.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">8:00</text>
  <line x1="568.0" y1="145" x2="568.0" y2="150" stroke="#e6e2d8" stroke-width="1"/>
  <line x1="626.7" y1="140" x2="626.7" y2="150" stroke="#7a7f85" stroke-width="1"/>
  <text x="626.7" y="134.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">10:00</text>
  <line x1="685.3" y1="145" x2="685.3" y2="150" stroke="#e6e2d8" stroke-width="1"/>
  <line x1="744.0" y1="145" x2="744.0" y2="150" stroke="#e6e2d8" stroke-width="1"/>
  <line x1="802.7" y1="140" x2="802.7" y2="150" stroke="#7a7f85" stroke-width="1"/>
  <text x="802.7" y="134.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">13:00</text>
  <line x1="861.3" y1="145" x2="861.3" y2="150" stroke="#e6e2d8" stroke-width="1"/>
  <line x1="920.0" y1="140" x2="920.0" y2="150" stroke="#7a7f85" stroke-width="1"/>
  <text x="920.0" y="134.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">15:00</text>
  <rect x="42.0" y="150.0" width="113.3" height="74.0" rx="3" fill="#fcfbf8" stroke="#c9c4b8" stroke-width="1"/>
  <text x="51.0" y="167.0" font-size="12" font-weight="700" fill="#363636" text-anchor="start">1</text>
  <text x="98.7" y="190.0" font-size="13" font-weight="700" fill="#363636" text-anchor="middle">the decision</text>
  <text x="98.7" y="214.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">2 min</text>
  <text x="98.7" y="250.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">who decides what,</text>
  <text x="98.7" y="267.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">what a mistake</text>
  <text x="98.7" y="284.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">costs</text>
  <rect x="159.3" y="150.0" width="172.0" height="74.0" rx="3" fill="#eaf1f7" stroke="#2471a3" stroke-width="2"/>
  <text x="168.3" y="167.0" font-size="12" font-weight="700" fill="#2471a3" text-anchor="start">2</text>
  <text x="245.3" y="190.0" font-size="15" font-weight="700" fill="#2471a3" text-anchor="middle">the tool</text>
  <text x="245.3" y="214.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">3 min</text>
  <text x="245.3" y="250.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">what it does, shown</text>
  <text x="245.3" y="267.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">live, on one real case</text>
  <rect x="335.3" y="150.0" width="172.0" height="74.0" rx="3" fill="#faeeee" stroke="#AF1F25" stroke-width="2"/>
  <text x="344.3" y="167.0" font-size="12" font-weight="700" fill="#AF1F25" text-anchor="start">3</text>
  <text x="421.3" y="190.0" font-size="15" font-weight="700" fill="#AF1F25" text-anchor="middle">the test</text>
  <text x="421.3" y="214.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">3 min</text>
  <text x="421.3" y="250.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">how many of ten,</text>
  <text x="421.3" y="267.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">next to the rival:</text>
  <text x="421.3" y="284.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">say the number</text>
  <rect x="511.3" y="150.0" width="113.3" height="74.0" rx="3" fill="#fcfbf8" stroke="#c9c4b8" stroke-width="1"/>
  <text x="520.3" y="167.0" font-size="12" font-weight="700" fill="#363636" text-anchor="start">4</text>
  <text x="568.0" y="190.0" font-size="13" font-weight="700" fill="#363636" text-anchor="middle">the cost</text>
  <text x="568.0" y="214.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">2 min</text>
  <text x="568.0" y="250.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">one answer,</text>
  <text x="568.0" y="267.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">one month,</text>
  <text x="568.0" y="284.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">hours saved</text>
  <rect x="628.7" y="150.0" width="172.0" height="74.0" rx="3" fill="#fcfbf8" stroke="#c9c4b8" stroke-width="1"/>
  <text x="637.7" y="167.0" font-size="12" font-weight="700" fill="#363636" text-anchor="start">5</text>
  <text x="714.7" y="183.0" font-size="15" font-weight="700" fill="#363636" text-anchor="middle">what could</text>
  <text x="714.7" y="199.0" font-size="15" font-weight="700" fill="#363636" text-anchor="middle">go wrong</text>
  <text x="714.7" y="214.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">3 min</text>
  <text x="714.7" y="250.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">the worst miss, the trap</text>
  <text x="714.7" y="267.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">that worked, the control</text>
  <text x="714.7" y="284.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">that stops it</text>
  <rect x="804.7" y="150.0" width="113.3" height="74.0" rx="3" fill="#fcfbf8" stroke="#c9c4b8" stroke-width="1"/>
  <text x="813.7" y="167.0" font-size="12" font-weight="700" fill="#363636" text-anchor="start">6</text>
  <text x="861.3" y="183.0" font-size="13" font-weight="700" fill="#363636" text-anchor="middle">what would have</text>
  <text x="861.3" y="199.0" font-size="13" font-weight="700" fill="#363636" text-anchor="middle">to be true</text>
  <text x="861.3" y="214.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="middle">2 min</text>
  <text x="861.3" y="250.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">for someone</text>
  <text x="861.3" y="267.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">to use it on</text>
  <text x="861.3" y="284.0" font-size="12" font-weight="400" fill="#363636" text-anchor="middle">Monday morning</text>
  <line x1="509.3" y1="146" x2="509.3" y2="232" stroke="#AF1F25" stroke-width="2.5"/>
  <rect x="417.3" y="70.0" width="184.0" height="30.0" rx="3" fill="#AF1F25" stroke="#AF1F25" stroke-width="1"/>
  <text x="509.3" y="90.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">the number, by minute 8</text>
  <text x="920.0" y="324.0" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="end">then questions: lines of the memo, cells of the sheet, picked at random</text>
  <text x="40.0" y="392.0" font-size="15" font-weight="700" fill="#363636" text-anchor="start">Said at minute 13, the number arrives after the room has already decided without it.</text>
</svg>