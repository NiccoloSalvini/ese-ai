<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#363636">What the model actually receives</text>

  <text x="30" y="78" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">WHAT YOU TYPE</text>
  <rect x="30" y="90" width="250" height="52" rx="3" fill="#fcfbf8" stroke="#c9c4b8"/>
  <text x="46" y="122" font-size="17" fill="#363636">Il margine è insostenibile</text>

  <path d="M292 116 L336 116" stroke="#7a7f85" stroke-width="2" marker-end="url(#a)"/>
  <text x="314" y="106" font-size="11" fill="#7a7f85" text-anchor="middle">split</text>

  <text x="348" y="78" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">TOKENS</text>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14">
    <rect x="348" y="90" width="46" height="52" rx="3" fill="#f3e3e4" stroke="#AF1F25"/><text x="371" y="122" fill="#AF1F25" text-anchor="middle">Il</text>
    <rect x="398" y="90" width="66" height="52" rx="3" fill="#f3e3e4" stroke="#AF1F25"/><text x="431" y="122" fill="#AF1F25" text-anchor="middle">marg</text>
    <rect x="468" y="90" width="46" height="52" rx="3" fill="#f3e3e4" stroke="#AF1F25"/><text x="491" y="122" fill="#AF1F25" text-anchor="middle">ine</text>
    <rect x="518" y="90" width="38" height="52" rx="3" fill="#f3e3e4" stroke="#AF1F25"/><text x="537" y="122" fill="#AF1F25" text-anchor="middle">è</text>
    <rect x="560" y="90" width="54" height="52" rx="3" fill="#f3e3e4" stroke="#AF1F25"/><text x="587" y="122" fill="#AF1F25" text-anchor="middle">inso</text>
    <rect x="618" y="90" width="66" height="52" rx="3" fill="#f3e3e4" stroke="#AF1F25"/><text x="651" y="122" fill="#AF1F25" text-anchor="middle">sten</text>
    <rect x="688" y="90" width="60" height="52" rx="3" fill="#f3e3e4" stroke="#AF1F25"/><text x="718" y="122" fill="#AF1F25" text-anchor="middle">ibile</text>
  </g>

  <path d="M760 116 L804 116" stroke="#7a7f85" stroke-width="2" marker-end="url(#a)"/>
  <text x="782" y="106" font-size="11" fill="#7a7f85" text-anchor="middle">look up</text>

  <text x="816" y="78" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a8955a">NUMBERS</text>
  <rect x="816" y="90" width="118" height="52" rx="3" fill="#363636"/>
  <text x="875" y="114" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#ffffff" text-anchor="middle">1847 9234 567</text>
  <text x="875" y="132" font-size="12" font-family="ui-monospace,Menlo,monospace" fill="#ffffff" text-anchor="middle">234 8901 2345</text>

  <text x="30" y="186" font-size="14" fill="#363636">Four words became <tspan font-weight="700" fill="#AF1F25">seven tokens</tspan>. The same sentence in English becomes five. The same meaning, a different bill.</text>

  <rect x="30" y="206" width="904" height="70" rx="3" fill="#fdf6f6" stroke="#e8cdce"/>
  <text x="48" y="230" font-size="13" font-weight="700" fill="#AF1F25">Four consequences, and every one of them will cost you money or accuracy</text>
  <text x="48" y="252" font-size="13" fill="#7a7f85">you are billed per token · the context window is counted in tokens · numbers and code fragment badly, which is why arithmetic is weak</text>
  <text x="48" y="270" font-size="13" fill="#7a7f85">· languages other than English cost more and are understood less well</text>

  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a7f85"/></marker></defs>
</svg>
