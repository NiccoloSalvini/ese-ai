  <text x="30" y="292" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >Only differences matter: “unchanged” scores 1.05 above “at”, so it is e^1.05 = 2.86 times as likely — 37.1% vs 13.0%.</text>
