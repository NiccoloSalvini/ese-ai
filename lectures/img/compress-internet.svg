<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" width="960" height="375" font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif">
  <text x="30" y="34" font-size="13" fill="#7a7f85">pre-training, as Karpathy draws it: training is compressing the internet</text>
  <rect x="30" y="70" width="260" height="120" fill="#f7f5ef" stroke="#363636" stroke-width="2"/>
  <text x="160" y="125" font-size="24" font-weight="700" text-anchor="middle" fill="#363636">~10 TB of text</text>
  <text x="160" y="155" font-size="14" text-anchor="middle" fill="#363636">a chunk of the internet</text>
  <rect x="350" y="70" width="260" height="120" fill="#f7f5ef" stroke="#2471a3" stroke-width="2"/>
  <text x="480" y="125" font-size="24" font-weight="700" text-anchor="middle" fill="#2471a3">6,000 GPUs &#215; 12 days</text>
  <text x="480" y="155" font-size="14" text-anchor="middle" fill="#363636">about $2 million of compute</text>
  <rect x="670" y="70" width="260" height="120" fill="#f7f5ef" stroke="#AF1F25" stroke-width="2"/>
  <text x="800" y="125" font-size="24" font-weight="700" text-anchor="middle" fill="#AF1F25">a 140 GB file</text>
  <text x="800" y="155" font-size="14" text-anchor="middle" fill="#363636">the parameters</text>
  <line x1="296" y1="130" x2="340" y2="130" stroke="#363636" stroke-width="2"/>
  <polygon points="340,123 350,130 340,137" fill="#363636"/>
  <line x1="616" y1="130" x2="660" y2="130" stroke="#363636" stroke-width="2"/>
  <polygon points="660,123 670,130 660,137" fill="#363636"/>
  <rect x="670" y="220" width="125" height="70" fill="#fff" stroke="#AF1F25" stroke-width="2"/>
  <text x="732" y="252" font-size="15" font-weight="700" text-anchor="middle" fill="#AF1F25">parameters</text>
  <text x="732" y="274" font-size="13" text-anchor="middle" fill="#363636">140 GB</text>
  <rect x="805" y="220" width="125" height="70" fill="#fff" stroke="#363636" stroke-width="2"/>
  <text x="867" y="252" font-size="15" font-weight="700" text-anchor="middle" fill="#363636">run.c</text>
  <text x="867" y="274" font-size="13" text-anchor="middle" fill="#363636">~500 lines of code</text>
  <text x="800" y="312" font-size="13" text-anchor="middle" fill="#7a7f85">what you download: two files</text>
  <text x="30" y="240" font-size="17" fill="#363636">About <tspan font-weight="700" fill="#AF1F25">70&#215; smaller</tspan> than the text it was trained on.</text>
  <text x="30" y="266" font-size="17" fill="#363636">So it is a <tspan font-weight="700">lossy zip file</tspan> of the internet:</text>
  <text x="30" y="292" font-size="17" fill="#363636">the gist is in there, the exact facts not always.</text>
  <line x1="30" y1="338" x2="930" y2="338" stroke="#e6e2d8"/>
  <text x="30" y="362" font-size="14" fill="#7a7f85">numbers for Llama 2 70B (2023), from Andrej Karpathy, "Intro to Large Language Models" &#8212; today&#8217;s frontier models are far bigger</text>
</svg>