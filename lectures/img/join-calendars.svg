  <text x="786" y="234" font-size="13" fill="#363636" text-anchor="end">57,800</text>
  <text x="802" y="234" font-size="13" fill="#363636">Mon</text>
  <text x="882" y="234" font-size="13" fill="#363636" text-anchor="end">509.10</text>
  <text x="706" y="262" font-size="12" fill="#AF1F25">two prices that never traded</text>
  <line x1="40" y1="292" x2="920" y2="292" stroke="#e6e2d8"/>
  <text x="40" y="322" font-size="14" fill="#2471a3">Monday&#8217;s BTC return reads <tspan font-weight="700">&#8722;5.56%</tspan> instead of <tspan font-weight="700">&#8722;0.52%</tspan> &#8212; a three-day move wearing a one-day label.</text>
  <text x="40" y="346" font-size="14" fill="#AF1F25">Two of every seven SPY returns are now exactly zero: <tspan font-weight="700">29% of the sample is fabricated</tspan>.</text>
  <text x="40" y="380" font-size="15" font-weight="700" fill="#363636">Decide which days exist before you compute anything across assets, and write the decision down.</text>
</svg>
