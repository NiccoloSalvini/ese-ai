  <text x="262" y="313.0" font-size="11" font-weight="400" fill="#7a7f85" text-anchor="middle" >tokens read earlier tokens · 2.36M</text>
  <line x1="86" y1="352" x2="262" y2="352" stroke="#1e8449" stroke-width="1.6"/>
  <line x1="262" y1="352" x2="262" y2="346" stroke="#7a7f85" stroke-width="1.8"/>
  <polygon points="262,346 265.5,354.3 258.5,354.3" fill="#7a7f85"/>
  <line x1="262" y1="324" x2="262" y2="318" stroke="#7a7f85" stroke-width="1.8"/>
  <polygon points="262,318 265.5,326.3 258.5,326.3" fill="#7a7f85"/>
  <line x1="112" y1="294" x2="95" y2="294" stroke="#1e8449" stroke-width="1.6"/>
  <circle cx="86" cy="294" r="9" fill="#fff" stroke="#1e8449" stroke-width="2"/>
  <text x="86" y="299" font-size="15" font-weight="700" fill="#1e8449" text-anchor="middle" >+</text>
  <rect x="112" y="238" width="300" height="20" fill="#fff" stroke="#7a7f85" stroke-width="2"/>
  <text x="262" y="253.0" font-size="12" font-weight="700" fill="#7a7f85" text-anchor="middle" >LayerNorm</text>
  <rect x="112" y="198" width="300" height="32" fill="#fff" stroke="#2471a3" stroke-width="2"/>
  <text x="262" y="213.0" font-size="14" font-weight="700" fill="#2471a3" text-anchor="middle" >MLP: 768 → 3,072 → 768 (GELU)</text>
  <text x="262" y="227.0" font-size="11" font-weight="400" fill="#7a7f85" text-anchor="middle" >each token on its own · 4.72M</text>
  <line x1="86" y1="266" x2="262" y2="266" stroke="#1e8449" stroke-width="1.6"/>
  <line x1="262" y1="266" x2="262" y2="260" stroke="#7a7f85" stroke-width="1.8"/>
  <polygon points="262,260 265.5,268.3 258.5,268.3" fill="#7a7f85"/>
