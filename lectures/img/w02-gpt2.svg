<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif">
  <text x="30" y="34" font-size="13" fill="#7a7f85">GPT-2 small, every layer, with its real sizes — gpt-oss has the same shape: 36 blocks, 128 experts in the MLP</text>
