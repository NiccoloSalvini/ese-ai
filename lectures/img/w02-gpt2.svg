  <text x="262" y="152.0" font-size="13" font-weight="700" fill="#7a7f85" text-anchor="middle" >final LayerNorm</text>
  <rect x="68" y="170" width="364" height="178" fill="#f7f5ef" stroke="#363636" stroke-width="2.2"/>
  <text x="440" y="266.0" font-size="20" font-weight="700" fill="#363636" text-anchor="start" >× 12</text>
  <text x="426" y="186" font-size="11" font-weight="700" fill="#a8955a" text-anchor="end" letter-spacing="1.2">ONE BLOCK</text>
