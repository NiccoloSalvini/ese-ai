  <text x="262" y="106.0" font-size="14" font-weight="700" fill="#a8955a" text-anchor="middle" >unembedding: 768 → 50,257 scores</text>
  <text x="262" y="120.0" font-size="11" font-weight="400" fill="#7a7f85" text-anchor="middle" >the token-embedding table, reused</text>
