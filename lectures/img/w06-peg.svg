<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" height="436" font-family="'Source Sans 3','Source Sans Pro',-apple-system,Helvetica,Arial,sans-serif">
  <rect width="960" height="436" fill="#ffffff"/>
  <defs><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a8955a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#AF1F25"/></marker><marker id="pn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2471a3"/></marker><marker id="pe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e8449"/></marker><marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a7f85"/></marker></defs>
  <text x="30" y="34" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="start">USDC, 10&#8211;13 March 2023: $3.3bn of about $40bn of reserves stuck in a bank that failed</text>
  <text x="40" y="72" font-size="12" font-weight="700" fill="#a8955a" text-anchor="start">THE RESERVE</text>
  <rect x="60" y="90" width="120" height="23.1" fill="#AF1F25"/>
  <rect x="60" y="113.1" width="120" height="256.9" fill="#2471a3" fill-opacity="0.85"/>
  <text x="196" y="106" font-size="14" font-weight="700" fill="#AF1F25" text-anchor="start">$3.3bn at Silicon Valley Bank &#8212; 8.25%</text>
  <text x="196" y="126" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">closed on Friday 10 March</text>
  <text x="196" y="240" font-size="14" font-weight="700" fill="#2471a3" text-anchor="start">$36.7bn elsewhere</text>
  <text x="196" y="260" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">cash at other banks, short Treasury bills</text>
  <text x="120" y="392" font-size="13" font-weight="400" fill="#363636" text-anchor="middle">about $40bn in all</text>
  <text x="560" y="72" font-size="12" font-weight="700" fill="#a8955a" text-anchor="start">ONE USDC</text>
  <line x1="610" y1="90" x2="610" y2="370" stroke="#c9c4b8" stroke-width="1"/>
  <line x1="605" y1="90.0" x2="610" y2="90.0" stroke="#c9c4b8" stroke-width="1"/>
  <text x="600" y="94.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end">$1.00</text>
  <line x1="605" y1="183.3333333333334" x2="610" y2="183.3333333333334" stroke="#c9c4b8" stroke-width="1"/>
  <text x="600" y="187.3333333333334" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end">$0.95</text>
  <line x1="605" y1="276.66666666666663" x2="610" y2="276.66666666666663" stroke="#c9c4b8" stroke-width="1"/>
  <text x="600" y="280.66666666666663" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end">$0.90</text>
  <line x1="605" y1="370.0" x2="610" y2="370.0" stroke="#c9c4b8" stroke-width="1"/>
  <text x="600" y="374.0" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="end">$0.85</text>
  <line x1="610" y1="90.0" x2="930" y2="90.0" stroke="#2471a3" stroke-width="2"/>
  <text x="626" y="82.0" font-size="13" font-weight="700" fill="#2471a3" text-anchor="start">the promise: one dollar</text>
  <line x1="610" y1="244.0" x2="930" y2="244.0" stroke="#a8955a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="626" y="236.0" font-size="13" font-weight="700" fill="#a8955a" text-anchor="start">$0.92: if every dollar at SVB were lost</text>
  <circle cx="700" cy="318.9" r="7" fill="#AF1F25"/>
  <text x="716" y="323.85333333333335" font-size="13" font-weight="700" fill="#AF1F25" text-anchor="start">about $0.88: Saturday 11 March</text>
  <line x1="700" y1="308.85333333333335" x2="700" y2="96.0" stroke="#1e8449" stroke-width="2" marker-end="url(#we)"/>
  <text x="712" y="136.66666666666669" font-size="13" font-weight="700" fill="#1e8449" text-anchor="start">Sunday night: every SVB deposit guaranteed;</text>
  <text x="712" y="154.66666666666669" font-size="13" font-weight="700" fill="#1e8449" text-anchor="start">by Monday 13 March, back to one dollar</text>
  <text x="30" y="420" font-size="15" font-weight="700" fill="#363636" text-anchor="start">The market went below the worst case. In a run, the question is not whether the money is there but who gets out first.</text>
</svg>
