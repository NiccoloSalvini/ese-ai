<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" width="960" height="346" font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif">
  <text x="30" y="34" font-size="13" fill="#7a7f85">step ④ for real — the MLP of block 1, on “rates”</text>
  <text x="30" y="70" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1"></text>
  <text x="150" y="70" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1">what happens</text>
  <text x="440" y="70" font-size="11" font-weight="700" fill="#7a7f85" text-anchor="start" letter-spacing="1.1">the real numbers</text>
  <line x1="30" y1="80" x2="950" y2="80" stroke="#AF1F25" stroke-width="1.5"/>
  <text x="30" y="108" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >LayerNorm</text>
  <text x="150" y="108" font-size="15" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">rescale the 768 numbers</text>
  <text x="440" y="108" font-size="15" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">mean -0.003, spread 0.199 → 0 and 1</text>
  <line x1="30" y1="120" x2="950" y2="120" stroke="#e6e2d8"/>
  <text x="30" y="142" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >expand</text>
  <text x="150" y="142" font-size="15" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">768 → 3,072 neurons</text>
  <text x="440" y="142" font-size="15" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">each: weigh, add, bias — 4× wider</text>
  <line x1="30" y1="154" x2="950" y2="154" stroke="#e6e2d8"/>
  <text x="30" y="176" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >switch</text>
  <text x="150" y="176" font-size="15" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">GELU: negatives → about 0</text>
  <text x="440" y="176" font-size="15" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">386 of 3,072 fire for “rates”</text>
  <line x1="30" y1="188" x2="950" y2="188" stroke="#e6e2d8"/>
  <text x="30" y="210" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >shrink</text>
  <text x="150" y="210" font-size="15" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">3,072 → 768</text>
  <text x="440" y="210" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >back to the width of the vector</text>
  <line x1="30" y1="222" x2="950" y2="222" stroke="#e6e2d8"/>
  <text x="30" y="244" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >add</text>
  <text x="150" y="244" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >⊕ to the vector</text>
  <text x="440" y="244" font-size="15" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">[ 0.83 −1.07 −0.10 …] → [ 1.97 −1.31 −1.59 …]</text>
  <line x1="30" y1="256" x2="950" y2="256" stroke="#e6e2d8"/>
  <text x="30" y="292" font-size="15" font-weight="700" fill="#363636" text-anchor="start" >4.72M numbers per block, ×12: two thirds of every block — 46% of GPT-2 — lives here.</text>
  <text x="30" y="316" font-size="15" font-weight="400" fill="#363636" text-anchor="start" >A hidden layer like card testing, 3,072 wide: each neuron is a question nobody wrote. In gpt-oss, 128 experts.</text>
</svg>