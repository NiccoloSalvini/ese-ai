  <text x="676" y="108" font-size="15" font-weight="700" fill="#363636" text-anchor="start">Our fee, decided</text>
  <text x="676" y="132" font-size="12" font-weight="400" fill="#363636" text-anchor="start">a share of every payment, for</text>
  <text x="676" y="149" font-size="12" font-weight="400" fill="#363636" text-anchor="start">example 10%, split off on the</text>
  <text x="676" y="166" font-size="12" font-weight="400" fill="#363636" text-anchor="start">way to the owner: we never</text>
  <text x="676" y="183" font-size="12" font-weight="400" fill="#363636" text-anchor="start">hold the money</text>
  <line x1="676" y1="216" x2="914" y2="216" stroke="#e6e2d8" stroke-width="1"/>
  <text x="676" y="242" font-size="13" font-weight="400" fill="#363636" text-anchor="start">€0.001 a call × 10% =</text>
  <text x="676" y="262" font-size="13" fill="#363636"><tspan font-weight="700" fill="#363636">€0.0001</tspan> to us on each call</text>
  <text x="676" y="294" font-size="13" font-weight="400" fill="#363636" text-anchor="start">1 million paid calls a month:</text>
  <text x="676" y="314" font-size="13" fill="#363636"><tspan font-weight="700" fill="#363636">€100</tspan> to us, <tspan font-weight="700" fill="#363636">€900</tspan> to the owners</text>
  <text x="676" y="350" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">the decision comes first; the code</text>
  <text x="676" y="367" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">that splits the payment comes later</text>
