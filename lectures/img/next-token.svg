  <rect x="574" y="232" width="90" height="58" fill="#c9c4b8" fill-opacity="0.9"/>
  <text x="619" y="224" font-size="14" font-weight="700" fill="#c9c4b8" text-anchor="middle">17%</text>
  <text x="619" y="310" font-size="13" fill="#363636" text-anchor="middle">everything else</text>
  <path d="M155 128 L155 106" stroke="#AF1F25" stroke-width="2"/>
  <text x="155" y="98" font-size="13" font-weight="700" fill="#AF1F25" text-anchor="middle">T = 0 lands here, every time</text>
  <path d="M104 300 L104 316 L438 316 L438 300" fill="none" stroke="#a8955a" stroke-width="2"/>
  <text x="271" y="334" font-size="13" font-weight="700" fill="#a8955a" text-anchor="middle">T &#8776; 0.7 samples in here</text>

