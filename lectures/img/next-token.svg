  <text x="387" y="310" font-size="13" fill="#363636" text-anchor="middle">at</text>
  <rect x="458" y="263" width="90" height="27" fill="#7a7f85" fill-opacity="0.9"/>
  <text x="503" y="255" font-size="14" font-weight="700" fill="#7a7f85" text-anchor="middle">8%</text>
