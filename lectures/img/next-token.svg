  <text x="768" y="120" font-size="15" font-weight="700" fill="#AF1F25">T = 0</text>
  <text x="768" y="140" font-size="13" fill="#7a7f85">extraction, classification,</text>
  <text x="768" y="157" font-size="13" fill="#7a7f85">anything you must reproduce</text>
  <text x="768" y="198" font-size="15" font-weight="700" fill="#a8955a">T &#8776; 0.7</text>
  <text x="768" y="218" font-size="13" fill="#7a7f85">drafting, ideation</text>
  <text x="768" y="258" font-size="15" font-weight="700" fill="#7a7f85">T high</text>
  <text x="768" y="278" font-size="13" fill="#7a7f85">wanders &#8212; rarely what</text>
  <text x="768" y="295" font-size="13" fill="#7a7f85">a business wants</text>
  <text x="768" y="330" font-size="13" fill="#363636">Different answer twice is</text>
  <text x="768" y="347" font-size="13" fill="#363636">not a fault. <tspan font-weight="700">Set T = 0.</tspan></text>
