  <text x="208.2" y="124" font-size="14" font-weight="700" fill="#7a7f85" text-anchor="start">1,722</text>
  <text x="30" y="156" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">stock-market days</text>
  <rect x="30" y="162" width="118" height="18" fill="#2471a3"/>
  <text x="154.2" y="176" font-size="14" font-weight="700" fill="#2471a3" text-anchor="start">1,182</text>
  <text x="30" y="208" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">equity calendar (drop weekends)</text>
