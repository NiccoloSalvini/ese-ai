  <text x="30" y="260" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">crypto calendar (fill weekends)</text>
  <rect x="30" y="266" width="172" height="18" fill="#a8955a"/>
  <text x="208.0" y="280" font-size="14" font-weight="700" fill="#a8955a" text-anchor="start">1,720</text>
  <text x="350" y="70" font-size="16" font-weight="700" fill="#363636" text-anchor="start">S&amp;P 500 volatility</text>
  <text x="350" y="104" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">equity calendar</text>
  <rect x="350" y="110" width="156" height="18" fill="#1e8449"/>
  <text x="512.3434304591094" y="124" font-size="14" font-weight="700" fill="#1e8449" text-anchor="start">17.4%</text>
  <text x="350" y="156" font-size="12" font-weight="400" fill="#7a7f85" text-anchor="start">crypto calendar</text>
