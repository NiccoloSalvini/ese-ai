  <line x1="30" y1="315" x2="930" y2="315" stroke="#e6e2d8"/>
  <text x="30" y="342" font-size="15" font-weight="400" fill="#363636" text-anchor="start">Filling the weekend invents 540 days on which the stock market ‘returned’ exactly zero.</text>
  <text x="30" y="366" font-size="15" font-weight="400" fill="#363636" text-anchor="start">It looks calmer and less connected to Bitcoin — because of days that never happened.</text>
