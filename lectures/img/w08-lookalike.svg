  <rect x="258" y="252" width="206" height="86" rx="3" fill="#eaf1f7" stroke="#2471a3" stroke-width="1"/>
  <text x="280" y="286" font-size="22" font-weight="700" fill="#2471a3" text-anchor="middle">2</text>
  <text x="302" y="286" font-size="14" font-weight="400" fill="#363636" text-anchor="start">a look-alike sends you</text>
  <text x="302" y="306" font-size="14" font-weight="400" fill="#363636" text-anchor="start">a tiny or zero transfer</text>
  <line x1="466" y1="295" x2="484" y2="295" stroke="#a8955a" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="486" y="252" width="206" height="86" rx="3" fill="#eaf1f7" stroke="#2471a3" stroke-width="1"/>
  <text x="508" y="286" font-size="22" font-weight="700" fill="#2471a3" text-anchor="middle">3</text>
  <text x="530" y="286" font-size="14" font-weight="400" fill="#363636" text-anchor="start">your history now</text>
  <text x="530" y="306" font-size="14" font-weight="400" fill="#363636" text-anchor="start">shows both</text>
  <line x1="694" y1="295" x2="712" y2="295" stroke="#a8955a" stroke-width="2" marker-end="url(#ag)"/>
