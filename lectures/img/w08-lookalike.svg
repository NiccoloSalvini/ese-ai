  <text x="534" y="152" font-size="22" font-weight="400" fill="#AF1F25" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">f694</text>
  <text x="600" y="152" font-size="22" font-weight="400" fill="#AF1F25" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">b927</text>
  <text x="674" y="152" font-size="22" font-weight="700" fill="#a8955a" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">e2a1</text>
  <text x="30" y="206" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="start">what your wallet shows for both:</text>
  <text x="290" y="207" font-size="22" font-weight="700" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0x3f5c…e2a1</text>
