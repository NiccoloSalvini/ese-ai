  <text x="758" y="286" font-size="14" font-weight="400" fill="#363636" text-anchor="start">next month you copy</text>
  <text x="758" y="306" font-size="14" font-weight="400" fill="#363636" text-anchor="start">the wrong one</text>
  <text x="30" y="380" font-size="16" font-weight="700" fill="#363636" text-anchor="start">Nothing was hacked. The ledger did exactly what it was told.</text>
  <text x="30" y="404" font-size="14" font-weight="400" fill="#7a7f85" text-anchor="start">A machine can check every tiny transfer against your real counterparties. A person glances at eight characters.</text>
