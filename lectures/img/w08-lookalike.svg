  <text x="674" y="88" font-size="22" font-weight="700" fill="#a8955a" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">e2a1</text>
  <text x="30" y="130" font-size="13" font-weight="400" fill="#7a7f85" text-anchor="start">the look-alike that sent you a tiny transfer, minutes later</text>
  <text x="30" y="152" font-size="22" font-weight="400" fill="#363636" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">0x</text>
  <text x="64" y="152" font-size="22" font-weight="700" fill="#a8955a" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">3f5c</text>
  <text x="138" y="152" font-size="22" font-weight="400" fill="#AF1F25" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">c31a</text>
  <text x="204" y="152" font-size="22" font-weight="400" fill="#AF1F25" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">72f6</text>
  <text x="270" y="152" font-size="22" font-weight="400" fill="#AF1F25" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">421f</text>
  <text x="336" y="152" font-size="22" font-weight="400" fill="#AF1F25" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">64ee</text>
  <text x="402" y="152" font-size="22" font-weight="400" fill="#AF1F25" text-anchor="start" font-family="'JetBrains Mono',Menlo,monospace">9bd4</text>
