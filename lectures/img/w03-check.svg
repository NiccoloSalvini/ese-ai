  <text x="619.1" y="281.0" font-size="18" font-weight="700" fill="#a8955a" text-anchor="start">361%</text>
  <text x="30.0" y="324.0" font-size="15" font-weight="700" fill="#AF1F25" text-anchor="start">compounded — what really happened</text>
  <rect x="320.0" y="306.0" width="421.2" height="28.0" fill="#AF1F25" fill-opacity="0.9"/>
  <text x="751.2" y="327.0" font-size="18" font-weight="700" fill="#AF1F25" text-anchor="start">526%</text>
  <text x="30.0" y="410.0" font-size="14" font-weight="400" fill="#363636" text-anchor="start">Bitcoin, 2018-01-01 to 2026-10-06. Two lines of code that run and look right; one makes it calmer, the other poorer, than it was.</text>
