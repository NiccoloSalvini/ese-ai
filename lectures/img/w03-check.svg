  <text x="30.0" y="118.0" font-size="15" font-weight="400" fill="#a8955a" text-anchor="start">√252 — the assistant</text>
  <rect x="320.0" y="100.0" width="252.5" height="28.0" fill="#a8955a" fill-opacity="0.5"/>
  <text x="582.5" y="121.0" font-size="18" font-weight="700" fill="#a8955a" text-anchor="start">53%</text>
  <text x="30.0" y="164.0" font-size="15" font-weight="700" fill="#AF1F25" text-anchor="start">√365 — crypto trades every day</text>
  <rect x="320.0" y="146.0" width="303.9" height="28.0" fill="#AF1F25" fill-opacity="0.9"/>
  <text x="633.9" y="167.0" font-size="18" font-weight="700" fill="#AF1F25" text-anchor="start">63%</text>
