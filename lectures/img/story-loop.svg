<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" width="960" height="355" font-family="'Source Sans 3','Source Sans Pro',Helvetica,Arial,sans-serif">
  <text x="30" y="34" font-size="13" fill="#7a7f85">how every neural network learns — from our one neuron to a hundred billion weights</text>
  <rect x="30" y="80" width="200" height="130" fill="#f7f5ef" stroke="#363636" stroke-width="2.5"/>
  <text x="130" y="116" font-size="19" font-weight="700" fill="#363636" text-anchor="middle" >1 · guess</text>
  <text x="130" y="150" font-size="15" font-weight="400" fill="#363636" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">p = σ(w·x + b)</text>
  <line x1="232" y1="145" x2="260" y2="145" stroke="#363636" stroke-width="1.6"/>
  <polygon points="260,145 251.7,148.5 251.7,141.5" fill="#363636"/>
  <rect x="262" y="80" width="200" height="130" fill="#f7f5ef" stroke="#AF1F25" stroke-width="2.5"/>
  <text x="362" y="116" font-size="19" font-weight="700" fill="#AF1F25" text-anchor="middle" >2 · how wrong?</text>
  <text x="362" y="150" font-size="15" font-weight="400" fill="#363636" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">loss =</text>
  <text x="362" y="174" font-size="14" font-weight="400" fill="#363636" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">−log p(right answer)</text>
  <line x1="464" y1="145" x2="492" y2="145" stroke="#363636" stroke-width="1.6"/>
  <polygon points="492,145 483.7,148.5 483.7,141.5" fill="#363636"/>
  <rect x="494" y="80" width="200" height="130" fill="#f7f5ef" stroke="#2471a3" stroke-width="2.5"/>
  <text x="594" y="116" font-size="19" font-weight="700" fill="#2471a3" text-anchor="middle" >3 · blame</text>
  <text x="594" y="150" font-size="15" font-weight="400" fill="#363636" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">for each weight:</text>
  <text x="594" y="174" font-size="15" font-weight="400" fill="#363636" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">(p − y) · x</text>
  <line x1="696" y1="145" x2="724" y2="145" stroke="#363636" stroke-width="1.6"/>
  <polygon points="724,145 715.7,148.5 715.7,141.5" fill="#363636"/>
  <rect x="726" y="80" width="200" height="130" fill="#f7f5ef" stroke="#1e8449" stroke-width="2.5"/>
  <text x="826" y="116" font-size="19" font-weight="700" fill="#1e8449" text-anchor="middle" >4 · nudge</text>
  <text x="826" y="150" font-size="15" font-weight="400" fill="#363636" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">w ← w − η · blame</text>
  <text x="826" y="174" font-size="15" font-weight="400" fill="#363636" text-anchor="middle" font-family="'JetBrains Mono',Menlo,monospace">η = learning rate</text>
  <path d="M825,212 C825,285 130,285 130,215" fill="none" stroke="#7a7f85" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="124,222 130,210 136,222" fill="#7a7f85"/>
  <text x="480" y="298" font-size="15" font-weight="400" fill="#7a7f85" text-anchor="middle" >repeat for every example, many times</text>
  <text x="480" y="338" font-size="14" font-weight="400" fill="#363636" text-anchor="middle" >step 3 is backpropagation · the perceptron rule was the same shape: w ← w + η · (y − ŷ) · x</text>
</svg>